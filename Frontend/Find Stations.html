<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nearby Stations — EV Charger</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ============ EV CHARGER DESIGN SYSTEM (shared tokens) ============ */
  :root {
    --bg:#FAFBF7; --panel:#FFFFFF; --field:#F4F6EF;
    --ink:#0E1A12; --ink-2:#2A362D; --muted:#6B7668;
    --line:#E6E8DF; --line-2:#D8DCCE;
    --accent:#1E7F47; --accent-2:#2FAE62; --accent-3:#B6E4C3; --accent-ink:#0C3B1F; --accent-hover:#176B3B;
    --dark-bg:#0E1A12; --dark-bg-2:#0A130D; --dark-ink:#EAF3EC;
    --danger:#B4442A; --warning:#C58A2E;
    --radius-sm:8px; --radius:12px; --radius-lg:14px; --radius-xl:22px;
    --shadow-sm: 0 1px 0 rgba(14,26,18,.04);
    --shadow:    0 1px 0 rgba(14,26,18,.04), 0 12px 40px -12px rgba(14,26,18,.10);
    --shadow-btn:0 1px 0 rgba(255,255,255,0.1) inset, 0 10px 24px -12px rgba(30,127,71,0.55);
    --ring:       0 0 0 4px rgba(30,127,71,0.12);
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg); color: var(--ink);
    font-family: 'Inter Tight', ui-sans-serif, system-ui, sans-serif;
    font-feature-settings: "ss01","cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.01em;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* Mobile-first app shell */
  .app {
    min-height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    background: var(--bg);
    position: relative;
  }
  @media (min-width: 900px) {
    .app {
      max-width: 1200px;
      height: 100dvh;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto 1fr auto;
      grid-template-areas:
        "head head"
        "hero hero"
        "map  list"
        "nav  nav";
      overflow: hidden;
    }
    .hero-area { grid-area: hero; }
  }

  /* ---------- Top header ---------- */
  .topbar {
    grid-area: head;
    position: sticky; top: 0; z-index: 30;
    padding: 14px 16px 12px;
    background: rgba(250,251,247,0.82);
    backdrop-filter: saturate(1.2) blur(10px);
    -webkit-backdrop-filter: saturate(1.2) blur(10px);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand { display:inline-flex; align-items:center; gap: 10px; font-weight: 500; font-size: 15px; letter-spacing:-0.01em; color: var(--ink); text-decoration:none; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(160deg, var(--accent-2), var(--accent));
    display: grid; place-items: center;
    box-shadow: 0 0 0 1px rgba(14,26,18,0.04), inset 0 1px 0 rgba(255,255,255,0.25);
    flex: none;
  }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--field); color: var(--accent-ink);
    display: grid; place-items: center;
    font-weight: 500; font-size: 13px;
    border: 1px solid var(--line);
    cursor: pointer;
    transition: border-color .2s var(--ease);
  }
  .avatar:hover { border-color: var(--accent); }

  /* ---------- Hero heading ---------- */
  .hero {
    padding: 20px 16px 12px;
  }
  @media (min-width: 900px) {
    .hero { grid-area: hero; padding: 20px 32px 12px; }
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .eyebrow::before { content:""; width: 24px; height: 1px; background: var(--line-2); }
  h1.title {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: clamp(34px, 7vw, 48px); line-height: 1.02; letter-spacing:-0.02em;
    margin: 10px 0 6px;
  }
  h1.title em { font-style: italic; color: var(--accent); }
  .sub { color: var(--muted); font-size: 14.5px; line-height: 1.5; margin: 0; max-width: 40ch; }

  /* ---------- Map ---------- */
  .map-area {
    grid-area: map;
    padding: 8px 16px 0;
  }
  @media (min-width: 900px) {
    .map-area {
      padding: 0 12px 20px 32px;
      align-self: stretch;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .map-area .map-card { flex: 1; min-height: 0; height: auto; }
  }

  /* floating locate button overlay on desktop map */
  .map-locate {
    position: absolute;
    left: 12px; top: 12px;
    z-index: 4;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 12px 8px 10px;
    background: rgba(255,255,255,0.96);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.005em;
    box-shadow: var(--shadow-sm);
    transition: all .18s var(--ease);
  }
  .map-locate:hover { border-color: var(--accent); color: var(--accent); }
  .map-locate.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .map-locate .ico-wrap {
    width: 22px; height: 22px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(182,228,195,0.4);
    color: var(--accent);
    flex: none;
  }
  .map-locate.active .ico-wrap { background: rgba(255,255,255,0.2); color: #fff; }
  .map-locate .loc-spinner { width: 12px; height: 12px; border-width: 2px; }
  .map-card {
    position: relative;
    border-radius: var(--radius-xl);
    overflow: hidden;
    background: #E3EEE1;
    border: 1px solid var(--line);
    aspect-ratio: 4 / 3;
    box-shadow: var(--shadow-sm);
  }

  .map-canvas { position: absolute; inset: 0; }
  .map-canvas svg { width: 100%; height: 100%; display: block; }

  /* map overlay controls */
  .map-ctrls {
    position: absolute; top: 12px; right: 12px;
    display: grid; gap: 6px;
    z-index: 2;
  }
  .map-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: rgba(255,255,255,0.95);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    color: var(--ink-2);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all .18s var(--ease);
  }
  .map-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* legend */
  .map-legend {
    position: absolute; bottom: 12px; left: 12px;
    display: flex; gap: 14px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.95);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-2);
    z-index: 2;
  }
  .leg { display: inline-flex; align-items: center; gap: 6px; }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; }
  .leg-dot.ok  { background: var(--accent-2); box-shadow: 0 0 0 2px rgba(47,174,98,0.2); }
  .leg-dot.off { background: var(--danger);   box-shadow: 0 0 0 2px rgba(180,68,42,0.15); }

  /* pins */
  .pin {
    position: absolute;
    transform: translate(-50%, -100%);
    cursor: pointer;
    transition: transform .2s var(--ease);
    z-index: 3;
  }
  .pin:hover, .pin.active { transform: translate(-50%, -100%) scale(1.08); z-index: 5; }
  .pin-body {
    width: 34px; height: 34px;
    border-radius: 50% 50% 50% 4px;
    transform: rotate(-45deg);
    display: grid; place-items: center;
    background: var(--accent);
    border: 2px solid #fff;
    box-shadow: 0 6px 14px -4px rgba(14,26,18,0.35);
  }
  .pin.off .pin-body { background: var(--danger); }
  .pin-body svg {
    transform: rotate(45deg);
    color: #fff;
  }
  .pin-pulse {
    position: absolute; left: 50%; bottom: -2px;
    transform: translateX(-50%);
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 0 0 rgba(47,174,98,0.6);
    animation: pinPulse 1.8s ease-out infinite;
  }
  .pin.off .pin-pulse { background: var(--danger); box-shadow: 0 0 0 0 rgba(180,68,42,0.45); animation-name: pinPulseErr; }
  @keyframes pinPulse    { 0% { box-shadow: 0 0 0 0 rgba(47,174,98,0.55); } 100% { box-shadow: 0 0 0 14px rgba(47,174,98,0); } }
  @keyframes pinPulseErr { 0% { box-shadow: 0 0 0 0 rgba(180,68,42,0.45); } 100% { box-shadow: 0 0 0 14px rgba(180,68,42,0); } }

  /* user-location dot */
  .me-dot {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #3B82F6;
    border: 3px solid #fff;
    box-shadow: 0 0 0 4px rgba(59,130,246,0.25), 0 2px 6px rgba(14,26,18,0.25);
    z-index: 4;
  }

  /* ---------- Use my location button ---------- */
  .locate-row {
    padding: 14px 16px 4px;
    display: grid;
    gap: 10px;
  }
  @media (min-width: 900px) {
    .locate-row { grid-area: list; padding: 0 32px 0 16px; }
  }

  .btn {
    appearance: none; border: 0; font: inherit; font-size: 15px; font-weight: 500;
    letter-spacing:-0.005em;
    padding: 14px 18px; border-radius: var(--radius);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: all .2s var(--ease);
    text-decoration: none;
  }
  .btn-primary   { background: var(--accent); color: #fff; box-shadow: var(--shadow-btn); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-secondary { background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn-ghost     { background: transparent; color: var(--ink-2); padding: 10px 12px; }
  .btn-ghost:hover:not(:disabled) { color: var(--accent); background: var(--field); }
  .btn-block     { width: 100%; }
  .btn-sm        { padding: 9px 14px; font-size: 13px; border-radius: 10px; }
  .btn:disabled  { opacity: 0.55; cursor: not-allowed; box-shadow: none; }

  .loc-btn {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line-2);
    justify-content: flex-start;
    padding: 14px 16px;
  }
  .loc-btn:hover:not(:disabled) { border-color: var(--accent); }
  .loc-btn .ico {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(182,228,195,0.35);
    color: var(--accent);
    display: grid; place-items: center;
    flex: none;
  }
  .loc-btn .txt { display: grid; gap: 2px; text-align: left; flex: 1; min-width: 0; }
  .loc-btn .txt .t1 { font-size: 14.5px; font-weight: 500; color: var(--ink); letter-spacing:-0.005em; }
  .loc-btn .txt .t2 { font-size: 12px; color: var(--muted); }
  .loc-btn .chev { color: var(--muted); flex: none; }
  .loc-btn.active .ico {
    background: var(--accent);
    color: #fff;
  }
  .loc-btn.active .t2 { color: var(--accent); }

  .loc-spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(30,127,71,0.25); border-top-color: var(--accent); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Section heading above list ---------- */
  .list-wrap {
    padding: 4px 16px 24px;
    display: grid; gap: 12px;
  }
  @media (min-width: 900px) {
    .list-wrap {
      grid-area: list;
      padding: 0 32px 20px 12px;
      overflow-y: auto;
      min-height: 0;
      align-self: stretch;
      align-content: start;
      gap: 14px;
    }
    .list-wrap .locate-row { display: none; }
  }

  .list-head {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .list-head .cap {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 8px;
    min-width: 0;
  }
  .list-head .cap .dash { width: 18px; height: 1px; background: var(--line-2); flex: none; }
  .list-head .cap .count {
    font-family: 'Inter Tight', sans-serif;
    font-size: 13px; font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.005em;
    text-transform: none;
    padding: 2px 8px;
    background: var(--field);
    border-radius: 999px;
    line-height: 1.3;
  }
  .sort-btn {
    appearance:none; font: inherit;
    background: var(--field);
    border: 1px solid var(--line);
    color: var(--ink-2);
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: -0.005em;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    border-radius: 999px;
    transition: all .18s var(--ease);
    white-space: nowrap;
    flex: none;
  }
  .sort-btn:hover { color: var(--accent); border-color: var(--accent); background: #fff; }
  .sort-btn .sort-lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .sort-btn:hover .sort-lbl { color: var(--accent); }

  /* ---------- Station card ---------- */
  .station {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: grid;
    gap: 12px;
    transition: border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .station:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
  .station.focused { border-color: var(--accent); box-shadow: var(--ring); }

  .st-top { display: flex; align-items: flex-start; gap: 12px; }
  .st-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(182,228,195,0.35);
    color: var(--accent);
    display: grid; place-items: center;
    flex: none;
    border: 1px solid rgba(30,127,71,0.12);
  }
  .station.inactive .st-icon { background: rgba(180,68,42,0.08); color: var(--danger); border-color: rgba(180,68,42,0.18); }

  .st-head { flex: 1; min-width: 0; display: grid; gap: 4px; }
  .st-name {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 22px; line-height: 1.1; letter-spacing: -0.015em;
    color: var(--ink);
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .st-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  .st-addr {
    font-size: 13.5px; color: var(--muted); line-height: 1.4;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    background: var(--field); color: var(--ink-2);
    border: 1px solid var(--line);
    line-height: 1;
    flex: none;
  }
  .badge::before {
    content:""; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }
  .badge-active {
    color: var(--accent);
    background: rgba(182,228,195,0.25);
    border-color: rgba(30,127,71,0.18);
  }
  .badge-active::before {
    background: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(47,174,98,0.2);
    animation: pulseDot 1.8s ease-in-out infinite;
  }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .badge-inactive {
    color: var(--danger);
    background: rgba(180,68,42,0.08);
    border-color: rgba(180,68,42,0.18);
  }
  .badge-inactive::before { background: var(--danger); }

  .st-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px 12px;
    background: var(--field);
    border-radius: var(--radius);
  }
  .meta-cell { display: grid; gap: 2px; }
  .meta-cell .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .meta-cell .val {
    font-size: 15px; font-weight: 500; color: var(--ink); letter-spacing: -0.005em;
    display: inline-flex; align-items: baseline; gap: 4px;
  }
  .meta-cell .val small { font-weight: 400; color: var(--muted); font-size: 11.5px; letter-spacing: 0.04em; }

  .st-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .ports-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--ink-2);
  }
  .ports-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 0 2px rgba(47,174,98,0.2); }
  .station.inactive .ports-badge .dot { background: var(--danger); box-shadow: 0 0 0 2px rgba(180,68,42,0.15); }

  .view-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent);
    color: #fff;
    padding: 10px 14px;
    font-size: 13.5px;
    font-weight: 500;
    border-radius: 10px;
    border: 0;
    cursor: pointer;
    text-decoration: none;
    transition: background .18s var(--ease), transform .12s var(--ease);
    box-shadow: 0 6px 14px -8px rgba(30,127,71,0.5);
  }
  .view-btn:hover { background: var(--accent-hover); }
  .view-btn .arrow { transition: transform .2s var(--ease); }
  .view-btn:hover .arrow { transform: translateX(3px); }
  .station.inactive .view-btn {
    background: var(--field);
    color: var(--ink-2);
    border: 1px solid var(--line-2);
    box-shadow: none;
  }
  .station.inactive .view-btn:hover { border-color: var(--ink-2); }

  /* ---------- Skeleton ---------- */
  .sk {
    background: linear-gradient(90deg, #EEF1EA 0%, #F6F8F2 50%, #EEF1EA 100%);
    background-size: 200% 100%;
    animation: shimmer 1.3s linear infinite;
    border-radius: 6px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .sk-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: grid; gap: 12px;
  }
  .sk-row { display: flex; gap: 12px; align-items: center; }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: center;
    padding: 32px 20px 24px;
    background: var(--panel);
    border: 1px dashed var(--line-2);
    border-radius: var(--radius-lg);
  }
  .empty-ico {
    width: 64px; height: 64px; border-radius: 20px;
    background: var(--field);
    color: var(--muted);
    display: grid; place-items: center;
    margin: 0 auto 16px;
  }
  .empty h3 {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 26px; line-height: 1.1; letter-spacing: -0.02em;
    margin: 0 0 8px;
  }
  .empty h3 em { font-style: italic; color: var(--accent); }
  .empty p { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 32ch; margin-left: auto; margin-right: auto; }

  /* ---------- Bottom nav ---------- */
  .nav {
    grid-area: nav;
    position: sticky; bottom: 0; z-index: 20;
    align-self: end;
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(1.2) blur(12px);
    -webkit-backdrop-filter: saturate(1.2) blur(12px);
    border-top: 1px solid var(--line);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  .nav-item {
    appearance:none; border:0; background: transparent;
    font: inherit;
    padding: 10px 8px;
    display: grid; gap: 3px; place-items: center;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    border-radius: 10px;
    text-decoration: none;
    transition: color .15s, background .15s;
    letter-spacing: 0.02em;
    position: relative;
  }

  }, [sort]);

  function useMyLocation() {
    if (hasLocation) { setHasLocation(false); return; }
    setLocating(true);
    setTimeout(() => {
      setLocating(false);
      setHasLocation(true);
    }, 1100);
  }

  const showStations = viewState === 'data';
  const showLoading  = viewState === 'loading';
  const showEmpty    = viewState === 'empty';

  return (
    <>
      <div className="app">
        {/* ===== Topbar ===== */}
        <header className="topbar" id="top-bar">
          <a className="brand" href="#">
            <span className="brand-mark" aria-hidden="true">
              <svg width="14" height="16" viewBox="0 0 14 16" fill="none">
                <path d="M8 1L1 9h4l-1 6 7-8H7l1-6z" fill="#fff"/>
              </svg>
            </span>
            <span>EV Charger</span>
          </a>
          <div style={{ display:'flex', alignItems:'center', gap: 8 }}>
            <button className="btn btn-ghost btn-sm" aria-label="Search" style={{ padding: '8px 10px' }}>
              <Ico.Search width="16" height="16"/>
            </button>
            <div className="avatar" role="button" aria-label="Account">JD</div>
          </div>
        </header>

        {/* ===== Hero heading ===== */}
        <section className="hero reveal">
          <span className="eyebrow">Nearby · Bangkok</span>
          <h1 className="title">Find a <em>charger</em>.</h1>
          <p className="sub">Live availability across the network, sorted by how close — and how quick — you can get there.</p>
        </section>

        {/* ===== Map ===== */}
        <section className="map-area" aria-label="Map">
          <MapPlaceholder
            stations={stations}
            activeId={activeStation}
            onPinClick={(id) => {
              setActiveStation(id);
              const el = document.getElementById(`station-${id}`);
              if (el) el.scrollIntoView({ block: 'nearest' });
            }}
            showMe={hasLocation}
            locating={locating}
            hasLocation={hasLocation}
            onLocate={useMyLocation}
          />
        </section>

        {/* ===== Locate + list ===== */}
        <section className="list-wrap">
          <div className="locate-row" style={{ paddingLeft: 0, paddingRight: 0 }}>
            <button
              id="use-my-location"
              className={`btn loc-btn btn-block ${hasLocation ? 'active' : ''}`}
              onClick={useMyLocation}
              aria-pressed={hasLocation}
              disabled={locating}
            >
              <span className="ico" aria-hidden="true">
                {locating ? <span className="loc-spinner"/> : <Ico.Crosshair width="18" height="18"/>}
              </span>
              <span className="txt">
                <span className="t1">{hasLocation ? 'Using your location' : 'Use my location'}</span>
                <span className="t2">
                  {locating ? 'Locating…' : hasLocation ? USER_LOC.label : 'Sort stations by real distance'}
                </span>
              </span>
              <Ico.Chevron className="chev" width="16" height="16"/>
            </button>
          </div>

          <div className="list-head">
            <span className="cap">
              <span className="dash" aria-hidden="true"/>
              {showStations ? (
                <>Results <span className="count">{stations.length}</span></>
              ) : showLoading ? 'Loading' : 'No results'}
            </span>
            {showStations && (
              <button className="sort-btn" onClick={() => setSort(s => s === 'distance' ? 'time' : 'distance')} aria-label={`Change sort. Currently sorting by ${sort === 'distance' ? 'distance' : 'drive time'}.`}>
                <Ico.Sort width="12" height="12"/>
                <span className="sort-lbl">Sort</span>
                <span>{sort === 'distance' ? 'Distance' : 'Drive time'}</span>
              </button>
            )}
          </div>

          <div id="stations-list" className={`reveal`} style={{ display: 'grid', gap: 12 }}>
            {showLoading && Array.from({ length: 4 }).map((_, i) => <SkeletonCard key={i}/>)}
            {showEmpty && <EmptyState onRetry={() => setViewState('data')}/>}
            {showStations && stations.map(s => (
              <StationCard
                key={s.id}
                s={s}
                focused={activeStation === s.id}
                onFocus={setActiveStation}
              />
            ))}
          </div>
        </section>

        {/* ===== Bottom nav ===== */}
        <nav className="nav" id="bottom-nav" aria-label="Primary">
          <a className="nav-item active" href="#" aria-current="page">
            <span className="nav-ico"><Ico.Home width="22" height="22"/></span>
            <span>Home</span>
          </a>
          <a className="nav-item" href="#">
            <span className="nav-ico"><Ico.Calendar width="22" height="22"/></span>
            <span>Bookings</span>
          </a>
          <a className="nav-item" href="#">
            <span className="nav-ico"><Ico.User width="22" height="22"/></span>
            <span>Profile</span>
          </a>
        </nav>
      </div>

      {/* ===== Demo state switcher (for previewing loading/empty) ===== */}
      <div className="state-switch" role="group" aria-label="Preview state">
        <button className={viewState==='data' ? 'on' : ''}    onClick={() => setViewState('data')}>Data</button>
        <button className={viewState==='loading' ? 'on' : ''} onClick={() => setViewState('loading')}>Loading</button>
        <button className={viewState==='empty' ? 'on' : ''}   onClick={() => setViewState('empty')}>Empty</button>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
