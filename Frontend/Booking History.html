<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Booking History — EV Charger</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ============ EV CHARGER DESIGN SYSTEM (shared tokens) ============ */
  :root {
    --bg:#FAFBF7; --panel:#FFFFFF; --field:#F4F6EF;
    --ink:#0E1A12; --ink-2:#2A362D; --muted:#6B7668;
    --line:#E6E8DF; --line-2:#D8DCCE;
    --accent:#1E7F47; --accent-2:#2FAE62; --accent-3:#B6E4C3; --accent-ink:#0C3B1F; --accent-hover:#176B3B;
    --dark-bg:#0E1A12; --dark-bg-2:#0A130D; --dark-ink:#EAF3EC;
    --danger:#B4442A; --warning:#C58A2E;
    --radius-sm:8px; --radius:12px; --radius-lg:14px; --radius-xl:22px;
    --shadow-sm: 0 1px 0 rgba(14,26,18,.04);
    --shadow:    0 1px 0 rgba(14,26,18,.04), 0 12px 40px -12px rgba(14,26,18,.10);
    --shadow-btn:0 1px 0 rgba(255,255,255,0.1) inset, 0 10px 24px -12px rgba(30,127,71,0.55);
    --ring:       0 0 0 4px rgba(30,127,71,0.12);
    --ring-err:   0 0 0 4px rgba(180,68,42,0.10);
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg); color: var(--ink);
    font-family: 'Inter Tight', ui-sans-serif, system-ui, sans-serif;
    font-feature-settings: "ss01","cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.01em;
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }

  .app {
    min-height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto auto auto 1fr;
    background: var(--bg);
    position: relative;
  }

  /* ---------- Topbar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    padding: 12px 16px;
    background: rgba(250,251,247,0.85);
    backdrop-filter: saturate(1.2) blur(10px);
    -webkit-backdrop-filter: saturate(1.2) blur(10px);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display:inline-flex; align-items:center; gap: 10px; font-weight: 500; font-size: 14px; letter-spacing:-0.01em; color: var(--ink-2); text-decoration:none; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(160deg, var(--accent-2), var(--accent));
    display: grid; place-items: center;
    box-shadow: 0 0 0 1px rgba(14,26,18,0.04), inset 0 1px 0 rgba(255,255,255,0.25);
    flex: none;
  }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--field); color: var(--accent-ink);
    display: grid; place-items: center;
    font-weight: 500; font-size: 13px;
    border: 1px solid var(--line);
    cursor: pointer;
  }

  /* ---------- Hero ---------- */
  .hero { padding: 20px 16px 12px; display: grid; gap: 8px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .eyebrow::before { content:""; width: 24px; height: 1px; background: var(--line-2); }
  h1.title {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: clamp(34px, 7vw, 48px); line-height: 1.02; letter-spacing:-0.02em;
    margin: 6px 0 2px;
  }
  h1.title em { font-style: italic; color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0; max-width: 46ch; }

  /* ---------- Filter tabs ---------- */
  .filter-wrap {
    position: sticky;
    top: 59px;
    z-index: 20;
    padding: 10px 16px 12px;
    background: rgba(250,251,247,0.85);
    backdrop-filter: saturate(1.2) blur(10px);
    -webkit-backdrop-filter: saturate(1.2) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .filter-tabs {
    display: inline-flex;
    gap: 4px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-tabs::-webkit-scrollbar { display: none; }
  .ftab {
    appearance: none; border: 0; background: transparent;
    font: inherit; font-size: 13px; font-weight: 500;
    letter-spacing: -0.005em;
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
    transition: color .18s var(--ease), background .18s var(--ease);
    flex: 1;
    justify-content: center;
  }
  .ftab:hover:not(.on) { color: var(--ink-2); }
  .ftab.on {
    background: var(--panel);
    color: var(--ink);
    box-shadow: 0 1px 0 rgba(14,26,18,0.04), 0 6px 14px -8px rgba(14,26,18,0.18);
  }
  .ftab .cnt {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em;
    background: var(--field);
    color: var(--muted);
    padding: 2px 7px;
    border-radius: 999px;
    min-width: 20px;
    text-align: center;
  }
  .ftab.on .cnt { background: rgba(182,228,195,0.45); color: var(--accent); }

  /* ---------- Booking list ---------- */
  .list-wrap {
    padding: 16px 16px 24px;
    display: grid; gap: 14px;
  }

  .list-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .list-head .cap {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .list-head .cap::before { content:""; width: 18px; height: 1px; background: var(--line-2); }
  .list-head .cap .count {
    font-family: 'Inter Tight', sans-serif;
    font-size: 13px; font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.005em;
    text-transform: none;
    padding: 2px 8px;
    background: var(--field);
    border-radius: 999px;
    line-height: 1.3;
    margin-left: 2px;
  }

  /* ---------- Booking card ---------- */
  .booking {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: grid;
    gap: 14px;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease);
    position: relative;
  }
  .booking:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
  .booking.cancelled { opacity: 0.78; }

  .bk-top {
    display: flex; gap: 12px; align-items: flex-start;
  }
  .bk-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(182,228,195,0.35);
    color: var(--accent);
    display: grid; place-items: center;
    flex: none;
    border: 1px solid rgba(30,127,71,0.12);
  }
  .booking.cancelled .bk-icon { background: rgba(180,68,42,0.08); color: var(--danger); border-color: rgba(180,68,42,0.18); }
  .booking.pending .bk-icon { background: rgba(197,138,46,0.12); color: var(--warning); border-color: rgba(197,138,46,0.22); }

  .bk-head { flex: 1; min-width: 0; display: grid; gap: 4px; }
  .bk-station {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 22px; line-height: 1.1; letter-spacing: -0.015em;
    color: var(--ink);
  }
  .bk-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  .bk-datetime {
    font-size: 13.5px; color: var(--ink-2); line-height: 1.4;
    display: flex; align-items: center; gap: 6px;
    flex-wrap: wrap;
  }
  .bk-datetime svg { color: var(--muted); flex: none; }
  .bk-datetime .dot {
    width: 3px; height: 3px; border-radius: 50%; background: var(--line-2);
    display: inline-block;
  }
  .bk-datetime .mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--muted);
  }

  .bk-badges { display: inline-flex; flex-direction: column; gap: 4px; align-items: flex-end; flex: none; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    line-height: 1;
    border: 1px solid var(--line);
    background: var(--field);
    color: var(--ink-2);
    font-weight: 500;
    white-space: nowrap;
  }
  .chip::before {
    content:""; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
    flex: none;
  }
  .chip-ok    { color: var(--accent);  background: rgba(182,228,195,0.3); border-color: rgba(30,127,71,0.2); }
  .chip-ok::before { background: var(--accent-2); box-shadow: 0 0 0 3px rgba(47,174,98,0.2); animation: pulseDot 1.8s ease-in-out infinite; }
  .chip-warn  { color: var(--warning); background: rgba(197,138,46,0.12); border-color: rgba(197,138,46,0.25); }
  .chip-err   { color: var(--danger);  background: rgba(180,68,42,0.1);   border-color: rgba(180,68,42,0.22); }
  .chip-done  { color: var(--muted);   background: var(--field); border-color: var(--line); }
  .chip-done::before { background: var(--muted); box-shadow: none; animation: none; }

  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* energy/amount strip */
  .bk-meta {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    padding: 12px;
    background: var(--field);
    border-radius: var(--radius);
  }
  .meta-cell { display: grid; gap: 2px; min-width: 0; }
  .meta-cell .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .meta-cell .val {
    font-size: 15px; font-weight: 500; color: var(--ink); letter-spacing: -0.005em;
    display: inline-flex; align-items: baseline; gap: 3px;
  }
  .meta-cell .val small { font-weight: 400; color: var(--muted); font-size: 11px; letter-spacing: 0.04em; }
  .meta-cell .val.serif {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 22px; line-height: 1;
  }
  .meta-cell .val.serif em { font-style: italic; color: var(--accent); }
  .booking.cancelled .meta-cell .val.serif em { color: var(--muted); text-decoration: line-through; }

  .bk-foot {
    display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
  }

  .btn {
    appearance: none; border: 0; font: inherit; font-size: 13.5px; font-weight: 500;
    letter-spacing:-0.005em;
    padding: 10px 16px; border-radius: 10px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: all .18s var(--ease);
    text-decoration: none;
  }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 6px 14px -8px rgba(30,127,71,0.5); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-secondary { background: var(--panel); color: var(--ink-2); border: 1px solid var(--line-2); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn-ghost-danger {
    background: transparent; color: var(--danger);
    border: 1px solid rgba(180,68,42,0.35);
  }
  .btn-ghost-danger:hover:not(:disabled) { background: rgba(180,68,42,0.06); border-color: var(--danger); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  .btn .arrow { transition: transform .2s var(--ease); }
  .btn:hover:not(:disabled) .arrow { transform: translateX(3px); }
  .btn-lg { padding: 14px 22px; font-size: 15px; border-radius: var(--radius); }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: center;
    padding: 48px 20px;
    background: var(--panel);
    border: 1px dashed var(--line-2);
    border-radius: var(--radius-lg);
    display: grid; gap: 14px; justify-items: center;
  }
  .empty-ico {
    width: 72px; height: 72px; border-radius: 22px;
    background: var(--field);
    color: var(--accent);
    display: grid; place-items: center;
    border: 1px solid var(--line);
  }
  .empty h3 {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 28px; line-height: 1.1; letter-spacing: -0.02em;
    margin: 0;
  }
  .empty h3 em { font-style: italic; color: var(--accent); }
  .empty p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 34ch; }

  /* ---------- Bottom nav ---------- */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    z-index: 20;
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(1.2) blur(12px);
    -webkit-backdrop-filter: saturate(1.2) blur(12px);
    border-top: 1px solid var(--line);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-inner {
    max-width: 720px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
  }
  .nav-item {
    appearance:none; border:0; background: transparent;
    font: inherit;
    padding: 10px 8px;
    display: grid; gap: 3px; place-items: center;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    border-radius: 10px;
    text-decoration: none;
    transition: color .15s, background .15s;
    letter-spacing: 0.02em;
    position: relative;
  }
  .nav-item:hover { color: var(--ink-2); background: var(--field); }
  .nav-item.active { color: var(--accent); }
  .nav-item.active::before {
    content:"";
    position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
    width: 20px; height: 3px;
    background: var(--accent);
    border-radius: 0 0 3px 3px;
  }
  .nav-item .nav-ico { width: 24px; height: 24px; display: grid; place-items: center; }

  /* ==========================================================
     PAYMENT MODAL
     ========================================================== */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(14,26,18,0.42);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 50;
    display: grid;
    place-items: end center;
    opacity: 0;
    animation: fadein .2s var(--ease) forwards;
  }
  @media (min-width: 640px) {
    .modal-backdrop { place-items: center; padding: 24px; }
  }
  @keyframes fadein { to { opacity: 1; } }
  .modal-backdrop.leaving { animation: fadeout .18s var(--ease) forwards; }
  @keyframes fadeout { to { opacity: 0; } }

  .modal {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    max-height: 92vh;
    overflow: auto;
    display: flex; flex-direction: column;
    transform: translateY(24px);
    animation: sheetIn .32s var(--ease) forwards;
    position: relative;
  }
  @media (min-width: 640px) {
    .modal { border-radius: var(--radius-xl); max-height: 86vh; }
  }
  @keyframes sheetIn { to { transform: translateY(0); } }
  .modal-backdrop.leaving .modal { animation: sheetOut .25s var(--ease) forwards; }
  @keyframes sheetOut { to { transform: translateY(24px); opacity: 0; } }

  .modal-grip {
    width: 40px; height: 4px;
    background: var(--line-2);
    border-radius: 999px;
    margin: 10px auto 0;
  }
  @media (min-width: 640px) { .modal-grip { display: none; } }

  .modal-head {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
  }
  .modal-head .mh-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
  }
  .modal-head h2 {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 28px; line-height: 1.08; letter-spacing: -0.02em;
    margin: 4px 0 0;
  }
  .modal-head h2 em { font-style: italic; color: var(--accent); }

  .modal-close {
    appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink-2);
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    cursor: pointer;
    transition: all .18s var(--ease);
    flex: none;
  }
  .modal-close:hover { border-color: var(--ink-2); color: var(--ink); }

  .modal-amount {
    padding: 18px 22px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 14px;
    border-bottom: 1px dashed var(--line-2);
    background: rgba(182,228,195,0.12);
  }
  .modal-amount .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
  }
  .modal-amount .amt {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 36px; line-height: 1; letter-spacing: -0.02em;
    color: var(--ink);
  }
  .modal-amount .amt em { font-style: italic; color: var(--accent); }
  .modal-amount .sta {
    font-size: 12.5px; color: var(--muted);
    margin-top: 4px;
    display: block;
  }

  .modal-body { padding: 18px 22px 10px; display: grid; gap: 16px; }
  .modal-body-head {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .modal-body-head::before { content:""; width: 18px; height: 1px; background: var(--line-2); }

  /* method selector */
  .methods { display: grid; gap: 8px; }
  .method {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 14px;
    cursor: pointer;
    transition: all .18s var(--ease);
    position: relative;
  }
  .method:hover { border-color: var(--line-2); }
  .method input { position: absolute; opacity: 0; pointer-events: none; }
  .method .m-ico {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--field);
    color: var(--ink-2);
    display: grid; place-items: center;
    flex: none;
    border: 1px solid var(--line);
  }
  .method .m-txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .method .m-name {
    font-size: 14px; font-weight: 500; color: var(--ink);
    letter-spacing: -0.005em;
  }
  .method .m-desc { font-size: 12px; color: var(--muted); }
  .method .m-radio {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid var(--line-2);
    display: grid; place-items: center;
    flex: none;
    transition: all .18s var(--ease);
  }
  .method.on {
    border-color: var(--accent);
    background: rgba(182,228,195,0.15);
    box-shadow: var(--ring);
  }
  .method.on .m-ico { background: rgba(182,228,195,0.45); color: var(--accent); border-color: rgba(30,127,71,0.2); }
  .method.on .m-radio { border-color: var(--accent); background: var(--accent); }
  .method.on .m-radio::after {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
  }

  /* method content panels */
  .m-panel {
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-top: 4px;
  }

  /* QR */
  .qr-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 8px 4px;
  }
  .qr-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    display: grid; gap: 10px; justify-items: center;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }
  .qr-card::before {
    content:""; position: absolute;
    top: -2px; left: -2px; right: -2px; height: 4px;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
  }
  .qr-img {
    width: 172px; height: 172px;
    display: grid; place-items: center;
    position: relative;
  }
  .qr-logo {
    position: absolute;
    width: 34px; height: 34px;
    background: #fff;
    border-radius: 8px;
    display: grid; place-items: center;
    border: 2px solid #fff;
    color: #003D6B;
    font-family: 'Instrument Serif', serif;
    font-size: 10px;
    line-height: 1;
    font-weight: 400;
    letter-spacing: 0;

  .qr-cap {

<body data-screen-label="Booking History">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const API_BASE = 'http://127.0.0.1:8000';

function normalize(b) {
  return {
    id: 'BK-' + String(b.booking_id).padStart(5, '0'),
    booking_id: b.booking_id,
    stationName: b.station_name,
    startIso: b.start_time,
    endIso: b.end_time,
    kwhUsed: b.total_kwh,
    ratePerKwh: b.rate_per_kwh_snapshot,
    bookingStatus: b.booking_status.toLowerCase(),
    paymentStatus: b.payment_status ? b.payment_status.toLowerCase() : 'pending',
    amount: b.amount,
  };
}

/* ============ utils ============ */
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
}
function bookingAmount(b) {
  if (b.amount != null) return b.amount;
  if (b.kwhUsed != null) return b.kwhUsed * b.ratePerKwh;
  return 0;
}

/* ============ Icons ============ */
const Ico = {
  Bolt:       (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/></svg>,
  BoltFill:   (p)=><svg {...p} viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>,
  Calendar:   (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,
  Clock:      (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,
  ArrowRight: (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  Close:      (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,
  Check:      (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  Home:       (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M4 11l8-7 8 7v9H4v-9z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/><path d="M10 20v-5h4v5" stroke="currentColor" strokeWidth="1.8"/></svg>,
  User:       (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" strokeWidth="1.8"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,
  Receipt:    (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M5 3h14v18l-3-2-3 2-3-2-3 2-2-2V3z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>,
  QR:         (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" stroke="currentColor" strokeWidth="1.8"/><rect x="14" y="3" width="7" height="7" stroke="currentColor" strokeWidth="1.8"/><rect x="3" y="14" width="7" height="7" stroke="currentColor" strokeWidth="1.8"/><path d="M14 14h3v3h-3zM20 14v3M14 20h7M17 20v1" stroke="currentColor" strokeWidth="1.8"/></svg>,
  CardFill:   (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="20" height="13" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M2 10h20" stroke="currentColor" strokeWidth="1.8"/><path d="M6 15h4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,
  CardOutline:(p)=><svg {...p} viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="20" height="13" rx="2" stroke="currentColor" strokeWidth="1.8"/><path d="M2 10h20M6 15h3M12 15h2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,
  Info:       (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="1.8"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,
};

/* ============ Status chip helpers ============ */
function bookingChip(status) {
  if (status === 'pending')   return <span className="chip chip-warn" data-booking-status="pending">Pending</span>;
  if (status === 'completed') return <span className="chip chip-ok"   data-booking-status="completed">Completed</span>;
  if (status === 'cancelled') return <span className="chip chip-err"  data-booking-status="cancelled">Cancelled</span>;
  return <span className="chip" data-booking-status={status}>{status}</span>;
}
function paymentChip(status) {
  if (status === 'pending')  return <span className="chip chip-warn" data-payment-status="pending">Unpaid</span>;
  if (status === 'paid')     return <span className="chip chip-ok"   data-payment-status="paid">Paid</span>;
  if (status === 'refunded') return <span className="chip chip-done" data-payment-status="refunded">Refunded</span>;
  return <span className="chip">{status}</span>;
}

/* ============ Booking Card ============ */
function BookingCard({ b, onCancel, onPay }) {
  const amount = bookingAmount(b);
  const kwh = b.kwhUsed != null ? b.kwhUsed : b.kwhEstimate;
  const amountIsEstimate = b.kwhUsed == null;

  const needsPayment = b.bookingStatus === 'completed' && b.paymentStatus === 'pending';
  const canCancel = b.bookingStatus === 'pending';

  return (
    <article
      className={`booking ${b.bookingStatus}`}
      id={`booking-${b.id}`}
      data-booking-id={b.id}
      data-booking-status={b.bookingStatus}
      data-payment-status={b.paymentStatus}
    >
      <div className="bk-top">
        <div className="bk-icon" aria-hidden="true">
          <Ico.Bolt width="22" height="22"/>
        </div>
        <div className="bk-head">
          <div className="bk-station">{b.stationName}</div>
          <div className="bk-datetime">
            <Ico.Calendar width="14" height="14"/>
            <span>{fmtDate(b.startIso)}</span>
            <span className="dot" aria-hidden="true"/>
            <Ico.Clock width="14" height="14"/>
            <span>{fmtTime(b.startIso)}–{fmtTime(b.endIso)}</span>
            <span className="dot" aria-hidden="true"/>
            <span className="mono">{b.id}</span>
          </div>
        </div>
        <div className="bk-badges">
          {bookingChip(b.bookingStatus)}
          {paymentChip(b.paymentStatus)}
        </div>
      </div>

      <div className="bk-meta">
        <div className="meta-cell">
          <span className="lbl">Energy</span>
          <span className="val">
            {kwh.toFixed(1)}<small>kWh</small>
          </span>
        </div>
        <div className="meta-cell">
          <span className="lbl">Rate</span>
          <span className="val">
            ฿{b.ratePerKwh.toFixed(1)}<small>/kWh</small>
          </span>
        </div>
        <div className="meta-cell" style={{textAlign:'right'}}>
          <span className="lbl">{amountIsEstimate ? 'Est. total' : 'Total'}</span>
          <span className="val serif">
            <em>฿{amount.toFixed(0)}</em>
          </span>
        </div>
      </div>

      {(canCancel || needsPayment) && (
        <div className="bk-foot">
          {canCancel && (
            <button
              className="btn btn-ghost-danger"
              data-action="cancel-booking"
              data-booking-id={b.id}
              onClick={() => onCancel(b.booking_id)}
            >
              Cancel Booking
            </button>
          )}
          {needsPayment && (
            <button
              className="btn btn-primary"
              data-action="pay-now"
              data-booking-id={b.id}
              onClick={() => onPay(b)}
            >
              Pay Now
              <Ico.ArrowRight className="arrow" width="14" height="14"/>
            </button>
          )}
        </div>
      )}
    </article>
  );
}

/* ============ Empty state ============ */
function EmptyState({ filter }) {
  const map = {
    all:       ['No bookings', 'yet.',        "Once you book a charging session, it'll show up here with status, receipts, and quick actions."],
    pending:   ['Nothing',     'pending.',    'All your upcoming sessions are paid and confirmed. New bookings appear here first.'],
    completed: ['No sessions', 'logged.',     "Completed charges will land here with full energy and payment receipts."],
    cancelled: ['Nothing',     'cancelled.',  'Cancelled bookings are kept here for your records — none so far.'],
  };
  const [t1, t2, body] = map[filter] || map.all;
  return (
    <div className="empty" id="empty-state" role="status">
      <div className="empty-ico" aria-hidden="true"><Ico.Receipt width="30" height="30"/></div>
      <h3>{t1} <em>{t2}</em></h3>
      <p>{body}</p>
      <a className="btn btn-secondary" href="#">Find a charger</a>
    </div>
  );
}

/* ============ Mock QR SVG ============ */
function MockQRCode() {
  // procedural "QR-ish" placeholder — readable enough as a preview, not a real code
  const size = 23;
  const modules = useMemo(() => {
    // deterministic pseudo-random pattern
    const m = [];
    let s = 987654321 >>> 0;
    const rnd = () => { s = (s * 1103515245 + 12345) >>> 0; return (s / 0xffffffff); };
    for (let y = 0; y < size; y++) {
      const row = [];
      for (let x = 0; x < size; x++) row.push(rnd() < 0.5 ? 1 : 0);
      m.push(row);
    }
    // clear finder patterns
    const clear = (cx, cy) => {
      for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) {
        const xx = cx + x, yy = cy + y;
        if (xx < size && yy < size) m[yy][xx] = 0;
      }
    };
    clear(0,0); clear(size-7,0); clear(0,size-7);
    return m;
  }, []);

  return (
    <svg width="172" height="172" viewBox={`0 0 ${size} ${size}`} shapeRendering="crispEdges" aria-label="Prompt Pay QR code (placeholder)">
      <rect width={size} height={size} fill="#fff"/>
      {modules.map((row, y) => row.map((v, x) => v
        ? <rect key={`${x}-${y}`} x={x} y={y} width="1" height="1" fill="#0E1A12"/>
        : null
      ))}
      {/* finder patterns */}
      {[[0,0],[size-7,0],[0,size-7]].map(([cx,cy],i)=>(
        <g key={i}>
          <rect x={cx} y={cy} width="7" height="7" fill="#0E1A12"/>
          <rect x={cx+1} y={cy+1} width="5" height="5" fill="#fff"/>
          <rect x={cx+2} y={cy+2} width="3" height="3" fill="#0E1A12"/>
        </g>
      ))}
    </svg>
  );
}

/* ============ Payment Modal ============ */
function PaymentModal({ booking, onClose, onSuccess }) {
  const [method, setMethod] = useState('promptpay');
  const [submitting, setSubmitting] = useState(false);
  const [success, setSuccess] = useState(false);
  const [leaving, setLeaving] = useState(false);

  // card form state
  const [card, setCard] = useState({ number: '', name: '', exp: '', cvc: '' });

  const amount = bookingAmount(booking);

  function close() {
    setLeaving(true);
    setTimeout(() => onClose(), 180);
  }

  async function confirm() {
    if (submitting) return;
    setSubmitting(true);
    const methodMap = { promptpay: 'Prompt Pay', credit: 'Credit Card', debit: 'Debit Card' };
    try {
      const res = await fetch(API_BASE + '/payments/' + booking.booking_id + '/pay', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ payment_method: methodMap[method] })
      });
      if (!res.ok) { const d = await res.json(); alert(d.detail || 'Payment failed.'); setSubmitting(false); return; }
      setSubmitting(false);
      setSuccess(true);
      setTimeout(() => onSuccess(booking.booking_id), 1600);
    } catch { alert('Cannot connect to server.'); setSubmitting(false); }
  }

  // esc to close
  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') close(); }
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, []);

  function formatCardNum(v) {
    return v.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim();
  }
  function formatExp(v) {
    const d = v.replace(/\D/g,'').slice(0,4);
    if (d.length <= 2) return d;
    return d.slice(0,2) + '/' + d.slice(2);
  }

  const methodOk =
    method === 'promptpay' ||
    (method !== 'promptpay' && card.number.replace(/\s/g,'').length >= 12 && card.exp.length >= 4 && card.cvc.length >= 3 && card.name.trim().length > 1);

  return (
    <div
      className={`modal-backdrop ${leaving ? 'leaving' : ''}`}
      role="dialog"
      aria-modal="true"
      aria-labelledby="pay-modal-title"
      id="payment-modal"
      onClick={(e) => { if (e.target.classList.contains('modal-backdrop')) close(); }}
    >
      <div className="modal">
        <div className="modal-grip" aria-hidden="true"/>

        {!success && (
          <>
            <header className="modal-head">
              <div>
                <div className="mh-eyebrow">Payment · {booking.id}</div>
                <h2 id="pay-modal-title">Pay for your <em>session.</em></h2>
              </div>
              <button className="modal-close" aria-label="Close" onClick={close}>
                <Ico.Close width="16" height="16"/>
              </button>
            </header>

            <div className="modal-amount">
              <div>
                <div className="lbl">Amount due</div>
                <span className="sta">{booking.stationName} · {fmtDate(booking.startIso)}, {fmtTime(booking.startIso)}</span>
              </div>
              <div className="amt">
                <em>฿{amount.toFixed(0)}</em>
              </div>
            </div>

            <div className="modal-body">
              <span className="modal-body-head">Choose a method</span>

              <div className="methods" role="radiogroup" aria-label="Payment method">
                <label className={`method ${method==='promptpay' ? 'on' : ''}`} data-method="promptpay">
                  <input type="radio" name="pay-method" checked={method==='promptpay'} onChange={() => setMethod('promptpay')} />
                  <span className="m-ico" aria-hidden="true"><Ico.QR width="20" height="20"/></span>
                  <span className="m-txt">
                    <span className="m-name">Prompt Pay</span>
                    <span className="m-desc">Scan QR with your banking app · no fee</span>
                  </span>
                  <span className="m-radio" aria-hidden="true"/>
                </label>

                <label className={`method ${method==='credit' ? 'on' : ''}`} data-method="credit">
                  <input type="radio" name="pay-method" checked={method==='credit'} onChange={() => setMethod('credit')} />
                  <span className="m-ico" aria-hidden="true"><Ico.CardFill width="20" height="20"/></span>
                  <span className="m-txt">
                    <span className="m-name">Credit Card</span>
                    <span className="m-desc">Visa, Mastercard, JCB · +2% fee</span>
                  </span>
                  <span className="m-radio" aria-hidden="true"/>
                </label>

                <label className={`method ${method==='debit' ? 'on' : ''}`} data-method="debit">
                  <input type="radio" name="pay-method" checked={method==='debit'} onChange={() => setMethod('debit')} />
                  <span className="m-ico" aria-hidden="true"><Ico.CardOutline width="20" height="20"/></span>
                  <span className="m-txt">
                    <span className="m-name">Debit Card</span>
                    <span className="m-desc">Bank debit · no fee</span>
                  </span>
                  <span className="m-radio" aria-hidden="true"/>
                </label>
              </div>

              {method === 'promptpay' && (
                <div className="m-panel">
                  <div className="qr-wrap">
                    <div className="qr-card">
                      <div className="qr-img">
                        <MockQRCode/>
                        <div className="qr-logo" aria-hidden="true">
                          <span className="l1">Pay</span>
                        </div>
                      </div>
                      <div className="qr-cap">฿{amount.toFixed(2)} · expires 5:00</div>
                    </div>
                    <p className="qr-note">
                      Open your banking app and scan the code. Press <strong>Confirm Payment</strong> after the bank confirms the transfer.
                    </p>
                  </div>
                </div>
              )}

              {(method === 'credit' || method === 'debit') && (
                <div className="m-panel">
                  <div style={{display:'grid', gap: 12}}>
                    <div className="field">
                      <label htmlFor="card-number">Card number</label>
                      <div className="input-wrap">
                        <input
                          id="card-number"
                          inputMode="numeric"
                          autoComplete="cc-number"
                          placeholder="4242 4242 4242 4242"
                          value={card.number}
                          onChange={(e) => setCard({...card, number: formatCardNum(e.target.value)})}
                        />
                        <span className="suffix">{card.number.startsWith('4') ? 'VISA' : card.number.startsWith('5') ? 'MC' : 'CARD'}</span>
                      </div>
                    </div>
                    <div className="field">
                      <label htmlFor="card-name">Name on card</label>
                      <div className="input-wrap">
                        <input
                          id="card-name"
                          autoComplete="cc-name"
                          placeholder="J. DOE"
                          value={card.name}
                          onChange={(e) => setCard({...card, name: e.target.value})}
                        />
                      </div>
                    </div>
                    <div className="row-2">
                      <div className="field">
                        <label htmlFor="card-exp">Expiry</label>
                        <div className="input-wrap">
                          <input
                            id="card-exp"
                            inputMode="numeric"
                            autoComplete="cc-exp"
                            placeholder="MM/YY"
                            value={card.exp}
                            onChange={(e) => setCard({...card, exp: formatExp(e.target.value)})}
                          />
                        </div>
                      </div>
                      <div className="field">
                        <label htmlFor="card-cvc">CVC</label>
                        <div className="input-wrap">
                          <input
                            id="card-cvc"
                            inputMode="numeric"
                            autoComplete="cc-csc"
                            placeholder="123"
                            maxLength={4}
                            value={card.cvc}
                            onChange={(e) => setCard({...card, cvc: e.target.value.replace(/\D/g,'').slice(0,4)})}
                          />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>

            <footer className="modal-foot">
              <button className="btn btn-secondary btn-lg" onClick={close} disabled={submitting}>
                Cancel
              </button>
              <button
                className="btn btn-primary btn-lg"
                data-action="confirm-payment"
                data-method={method}
                data-booking-id={booking.id}
                disabled={!methodOk || submitting}
                onClick={confirm}
              >
                {submitting
                  ? <><span style={{width:14,height:14,borderRadius:'50%',border:'2px solid rgba(255,255,255,0.35)',borderTopColor:'#fff',animation:'spin .8s linear infinite'}}/> Confirming…</>
                  : <>Confirm Payment <Ico.ArrowRight className="arrow" width="14" height="14"/></>
                }
              </button>
            </footer>
          </>
        )}

        {success && (
          <div className="pay-success" id="payment-success">
            <div className="pay-success-ring" aria-hidden="true">
              <Ico.Check width="44" height="44"/>
            </div>
            <div>
              <h3>Payment <em>received.</em></h3>
              <p style={{margin:'6px 0 0', color:'var(--muted)', fontSize:14, lineHeight:1.5}}>A receipt is on its way to your inbox.</p>
            </div>
            <div className="receipt">
              <div className="row"><span className="k">Booking</span><span className="v mono">{booking.id}</span></div>
              <div className="row"><span className="k">Station</span><span className="v">{booking.stationName}</span></div>
              <div className="row"><span className="k">Method</span><span className="v">{method==='promptpay'?'Prompt Pay':method==='credit'?'Credit Card':'Debit Card'}</span></div>
              <div className="row"><span className="k">Amount</span><span className="v">฿{amount.toFixed(2)}</span></div>
            </div>
            <button className="btn btn-primary btn-lg" style={{alignSelf:'stretch'}} onClick={close}>
              Done
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============ App ============ */
function App() {
  const [filter, setFilter] = useState('all');
  const [bookings, setBookings] = useState([]);
  const [payingFor, setPayingFor] = useState(null);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState('');

  const custId = localStorage.getItem('cust_id');

  useEffect(() => {
    if (!custId) {
      setLoadError('Not logged in. Please sign in first.');
      setLoading(false);
      return;
    }
    fetch(API_BASE + '/bookings/history/' + custId)
      .then(r => r.json())
      .then(data => { setBookings(data.map(normalize)); setLoading(false); })
      .catch(() => { setLoadError('Could not load bookings. Please try again.'); setLoading(false); });
  }, []);

  const filtered = useMemo(() => {
    const sorted = [...bookings].sort((a,b) => new Date(b.startIso) - new Date(a.startIso));
    if (filter === 'all') return sorted;
    return sorted.filter(b => b.bookingStatus === filter);
  }, [bookings, filter]);

  const counts = useMemo(() => ({
    all: bookings.length,
    pending: bookings.filter(b => b.bookingStatus === 'pending').length,
    completed: bookings.filter(b => b.bookingStatus === 'completed').length,
    cancelled: bookings.filter(b => b.bookingStatus === 'cancelled').length,
  }), [bookings]);

  async function handleCancel(bookingId) {
    if (!window.confirm('Cancel this booking?')) return;
    try {
      const res = await fetch(API_BASE + '/bookings/' + bookingId + '/cancel', { method: 'PATCH' });
      if (!res.ok) { const d = await res.json(); alert(d.detail || 'Failed to cancel.'); return; }
      setBookings(list => list.map(b => b.booking_id === bookingId ? { ...b, bookingStatus: 'cancelled' } : b));
    } catch { alert('Cannot connect to server.'); }
  }

  function handlePaySuccess(bookingId) {
    setBookings(list => list.map(b => b.booking_id === bookingId ? { ...b, paymentStatus: 'paid' } : b));
    setPayingFor(null);
  }

  return (
    <>
      <div className="app">
        {/* ===== Topbar ===== */}
        <header className="topbar">
          <a className="brand" href="#">
            <span className="brand-mark" aria-hidden="true">
              <svg width="13" height="15" viewBox="0 0 14 16" fill="none">
                <path d="M8 1L1 9h4l-1 6 7-8H7l1-6z" fill="#fff"/>
              </svg>
            </span>
            <span>EV Charger</span>
          </a>
          <div className="avatar" role="button" aria-label="Account">JD</div>
        </header>

        {/* ===== Hero ===== */}
        <section className="hero reveal">
          <span className="eyebrow">Bookings · account</span>
          <h1 className="title">Every charge, <em>accounted for.</em></h1>
          <p className="sub">Receipts, status, and quick actions for every session — past, upcoming, and everything in between.</p>
        </section>

        {/* ===== Filter tabs ===== */}
        <div className="filter-wrap" role="region" aria-label="Filter bookings">
          <div className="filter-tabs" role="tablist">
            {[
              ['all','All'],
              ['pending','Pending'],
              ['completed','Completed'],
              ['cancelled','Cancelled'],
            ].map(([key, label]) => (
              <button
                key={key}
                className={`ftab ${filter===key ? 'on' : ''}`}
                role="tab"
                aria-selected={filter===key}
                data-filter={key}
                onClick={() => setFilter(key)}
              >
                {label}
                <span className="cnt">{counts[key]}</span>
              </button>
            ))}
          </div>
        </div>

        {/* ===== List ===== */}
        <section className="list-wrap">
          <div className="list-head">
            <span className="cap">
              Results <span className="count">{filtered.length}</span>
            </span>
            <span style={{fontFamily:"'JetBrains Mono',monospace", fontSize:10, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--muted)'}}>
              Newest first
            </span>
          </div>

          {loading && <div style={{padding:'40px 0', textAlign:'center', color:'var(--muted)'}}>Loading…</div>}
          {loadError && <div style={{padding:'24px 0', textAlign:'center', color:'var(--danger)'}}>{loadError}</div>}
          {!loading && !loadError && filtered.length === 0 && <EmptyState filter={filter}/>}

          {!loading && !loadError && filtered.length > 0 && (
            <div className="reveal" style={{display:'grid', gap:14}} id="bookings-list">
              {filtered.map(b => (
                <BookingCard key={b.id} b={b} onCancel={handleCancel} onPay={setPayingFor}/>
              ))}
            </div>
          )}
        </section>
      </div>

      {/* ===== Bottom nav ===== */}
      <nav className="nav" aria-label="Primary">
        <div className="nav-inner">
          <a className="nav-item" href="#">
            <span className="nav-ico"><Ico.Home width="22" height="22"/></span>
            <span>Home</span>
          </a>
          <a className="nav-item active" href="#" aria-current="page">
            <span className="nav-ico"><Ico.Calendar width="22" height="22"/></span>
            <span>Bookings</span>
          </a>
          <a className="nav-item" href="#">
            <span className="nav-ico"><Ico.User width="22" height="22"/></span>
            <span>Profile</span>
          </a>
        </div>
      </nav>

      {/* ===== Payment modal ===== */}
      {payingFor && (
        <PaymentModal
          booking={payingFor}
          onClose={() => setPayingFor(null)}
          onSuccess={handlePaySuccess}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
