<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Station Detail & Booking — EV Charger</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ============ EV CHARGER DESIGN SYSTEM (shared tokens) ============ */
  :root {
    --bg:#FAFBF7; --panel:#FFFFFF; --field:#F4F6EF;
    --ink:#0E1A12; --ink-2:#2A362D; --muted:#6B7668;
    --line:#E6E8DF; --line-2:#D8DCCE;
    --accent:#1E7F47; --accent-2:#2FAE62; --accent-3:#B6E4C3; --accent-ink:#0C3B1F; --accent-hover:#176B3B;
    --dark-bg:#0E1A12; --dark-bg-2:#0A130D; --dark-ink:#EAF3EC;
    --danger:#B4442A; --warning:#C58A2E;
    --radius-sm:8px; --radius:12px; --radius-lg:14px; --radius-xl:22px;
    --shadow-sm: 0 1px 0 rgba(14,26,18,.04);
    --shadow:    0 1px 0 rgba(14,26,18,.04), 0 12px 40px -12px rgba(14,26,18,.10);
    --shadow-btn:0 1px 0 rgba(255,255,255,0.1) inset, 0 10px 24px -12px rgba(30,127,71,0.55);
    --ring:       0 0 0 4px rgba(30,127,71,0.12);
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg); color: var(--ink);
    font-family: 'Inter Tight', ui-sans-serif, system-ui, sans-serif;
    font-feature-settings: "ss01","cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.01em;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---------- App shell (mobile-first) ---------- */
  .app {
    min-height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: var(--bg);
    position: relative;
    padding-bottom: 96px; /* room for sticky CTA */
  }
  @media (min-width: 960px) {
    .app {
      max-width: 1100px;
      padding: 0 0 120px;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 32px;
      padding: 8px 32px 24px;
      align-items: start;
    }
    .col-left, .col-right { display: grid; gap: 20px; }
  }

  /* ---------- Topbar with back button ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    padding: 12px 16px;
    background: rgba(250,251,247,0.85);
    backdrop-filter: saturate(1.2) blur(10px);
    -webkit-backdrop-filter: saturate(1.2) blur(10px);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  @media (min-width: 960px) {
    .topbar { padding: 14px 32px; }
  }
  .back-btn {
    appearance: none; border: 1px solid var(--line-2);
    background: var(--panel);
    font: inherit;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px 8px 10px;
    border-radius: 999px;
    color: var(--ink);
    font-size: 13px; font-weight: 500;
    letter-spacing: -0.005em;
    cursor: pointer;
    transition: all .18s var(--ease);
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .back-btn .ico {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--field);
    display: grid; place-items: center;
    transition: background .18s var(--ease), color .18s var(--ease);
  }
  .back-btn:hover .ico { background: rgba(182,228,195,0.4); color: var(--accent); }

  .brand { display:inline-flex; align-items:center; gap: 10px; font-weight: 500; font-size: 14px; letter-spacing:-0.01em; color: var(--ink-2); text-decoration:none; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(160deg, var(--accent-2), var(--accent));
    display: grid; place-items: center;
    box-shadow: 0 0 0 1px rgba(14,26,18,0.04), inset 0 1px 0 rgba(255,255,255,0.25);
    flex: none;
  }

  /* ---------- Station header ---------- */
  .station-head {
    padding: 20px 16px 12px;
    display: grid; gap: 10px;
  }
  @media (min-width: 960px) {
    .station-head { padding: 24px 32px 8px; }
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .eyebrow::before { content:""; width: 24px; height: 1px; background: var(--line-2); }

  h1.title {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: clamp(34px, 6vw, 52px); line-height: 1.02; letter-spacing:-0.02em;
    margin: 4px 0 2px;
  }
  h1.title em { font-style: italic; color: var(--accent); }

  .st-addr-row {
    display: flex; align-items: flex-start; gap: 8px;
    color: var(--muted); font-size: 14px; line-height: 1.5;
    max-width: 46ch;
  }
  .st-addr-row svg { flex: none; margin-top: 3px; color: var(--accent); }

  .head-meta {
    display: flex; flex-wrap: wrap; gap: 8px 10px;
    margin-top: 6px;
    align-items: center;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    background: var(--field); color: var(--ink-2);
    border: 1px solid var(--line);
    line-height: 1;
    flex: none;
  }
  .badge-dot::before {
    content:""; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }
  .badge-active {
    color: var(--accent);
    background: rgba(182,228,195,0.25);
    border-color: rgba(30,127,71,0.18);
  }
  .badge-active::before {
    background: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(47,174,98,0.2);
    animation: pulseDot 1.8s ease-in-out infinite;
  }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .st-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  /* ---------- Section labels ---------- */
  .section-head {
    padding: 22px 16px 10px;
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 14px;
  }
  @media (min-width: 960px) {
    .section-head { padding: 8px 0 10px; }
  }
  .section-head h2 {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 26px; line-height: 1.08; letter-spacing:-0.02em;
    margin: 2px 0 0;
  }
  .section-head h2 em { font-style: italic; color: var(--accent); }
  .section-head .sec-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .section-head .sec-num::before { content:""; width: 18px; height: 1px; background: var(--line-2); }
  .section-head .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- Chargers list ---------- */
  .charger-list {
    padding: 0 16px;
    display: grid; gap: 12px;
  }
  @media (min-width: 960px) {
    .charger-list { padding: 0; }
  }

  .charger {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: grid;
    gap: 14px;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease);
  }
  .charger:hover:not(.unavailable) { border-color: var(--line-2); transform: translateY(-1px); box-shadow: var(--shadow); }
  .charger.selected {
    border-color: var(--accent);
    box-shadow: var(--ring);
    background: #fff;
  }
  .charger.selected::after {
    content: "Selected";
    position: absolute;
    top: -9px; left: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    background: var(--accent);
    color: #fff;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .charger.unavailable { opacity: 0.72; }

  .ch-top {
    display: flex; gap: 12px; align-items: flex-start;
  }
  .ch-icon {
    width: 48px; height: 48px; border-radius: 12px;
    background: rgba(182,228,195,0.35);
    color: var(--accent);
    display: grid; place-items: center;
    flex: none;
    border: 1px solid rgba(30,127,71,0.12);
  }
  .charger.unavailable .ch-icon { background: rgba(180,68,42,0.08); color: var(--danger); border-color: rgba(180,68,42,0.18); }

  .ch-head { flex: 1; min-width: 0; display: grid; gap: 4px; }
  .ch-name {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 22px; line-height: 1.1; letter-spacing: -0.015em;
    color: var(--ink);
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px;
  }
  .ch-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
  }
  .ch-type-row {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  .badge-ac, .badge-dc {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.14em;
    padding: 3px 8px;
    border-radius: 999px;
    line-height: 1;
    font-weight: 500;
  }
  .badge-ac {
    background: rgba(182,228,195,0.35);
    color: var(--accent-ink);
    border: 1px solid rgba(30,127,71,0.2);
  }
  .badge-dc {
    background: var(--ink);
    color: var(--dark-ink);
    border: 1px solid var(--ink);
  }
  .badge-status-ok {
    color: var(--accent);
    background: rgba(182,228,195,0.25);
    border: 1px solid rgba(30,127,71,0.18);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 3px 8px 3px 6px;
    border-radius: 999px;
    line-height: 1;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .badge-status-ok::before {
    content:""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(47,174,98,0.2);
    animation: pulseDot 1.8s ease-in-out infinite;
  }
  .badge-status-busy {
    color: var(--warning);
    background: rgba(197,138,46,0.12);
    border: 1px solid rgba(197,138,46,0.25);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 3px 8px 3px 6px;
    border-radius: 999px;
    line-height: 1;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .badge-status-busy::before {
    content:""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--warning);
  }
  .badge-status-off {
    color: var(--danger);
    background: rgba(180,68,42,0.08);
    border: 1px solid rgba(180,68,42,0.2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 3px 8px 3px 6px;
    border-radius: 999px;
    line-height: 1;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .badge-status-off::before {
    content:""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--danger);
  }

  .ch-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px 12px;
    background: var(--field);
    border-radius: var(--radius);
  }
  .meta-cell { display: grid; gap: 2px; }
  .meta-cell .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .meta-cell .val {
    font-size: 16px; font-weight: 500; color: var(--ink); letter-spacing: -0.005em;
    display: inline-flex; align-items: baseline; gap: 4px;
  }
  .meta-cell .val small { font-weight: 400; color: var(--muted); font-size: 11.5px; letter-spacing: 0.04em; }

  .ch-foot {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 10px;
  }
  .select-btn {
    appearance: none; border: 0; font: inherit;
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent);
    color: #fff;
    padding: 10px 16px;
    font-size: 13.5px; font-weight: 500;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    transition: background .18s var(--ease), transform .12s var(--ease);
    box-shadow: 0 6px 14px -8px rgba(30,127,71,0.5);
  }
  .select-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .select-btn:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
  .select-btn .arrow { transition: transform .2s var(--ease); }
  .select-btn:hover:not(:disabled) .arrow { transform: translateX(3px); }
  .charger.selected .select-btn {
    background: var(--panel);
    color: var(--accent);
    border: 1px solid var(--accent);
    box-shadow: none;
  }
  .charger.selected .select-btn::before {
    content: "";
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");
    background-size: 10px;
    background-position: center;
    background-repeat: no-repeat;
  }
  .charger.selected .select-btn .arrow { display: none; }
  .charger.unavailable .select-btn {
    background: var(--field);
    color: var(--muted);
    box-shadow: none;
  }

  /* ---------- Booking panel ---------- */
  .booking-panel {
    margin: 0 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: opacity .25s var(--ease);
  }
  @media (min-width: 960px) {
    .booking-panel { margin: 0; position: sticky; top: 80px; }
  }
  .booking-panel.disabled {
    opacity: 0.55;
    pointer-events: none;
    filter: grayscale(0.4);
  }

  .bp-hint {
    padding: 16px 18px;
    border-bottom: 1px dashed var(--line-2);
    background: rgba(182,228,195,0.18);
    color: var(--accent-ink);
    font-size: 13px;
    line-height: 1.4;
    display: flex; gap: 10px; align-items: center;
  }
  .bp-hint svg { flex: none; color: var(--accent); }
  .bp-hint strong { font-weight: 500; }

  .bp-body {
    padding: 18px;
    display: grid; gap: 18px;
  }

  .bp-row-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  .bp-row-head .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .bp-row-head .sub {
    font-size: 12.5px; color: var(--muted);
  }
  .bp-row-head .sub em { color: var(--ink-2); font-style: normal; font-weight: 500; }

  /* ---------- Date pills ---------- */
  .date-pills {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 6px;
    margin-top: 10px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .date-pills::-webkit-scrollbar { display: none; }
  @media (max-width: 520px) {
    .date-pills {
      display: flex;
      grid-template-columns: none;
      overflow-x: auto;
      padding-bottom: 4px;
      margin: 10px -4px 0;
    }
    .date-pills .date-pill { flex: 0 0 auto; min-width: 60px; }
  }

  .date-pill {
    appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink-2);
    font: inherit; cursor: pointer;
    padding: 10px 6px 9px;
    border-radius: var(--radius);
    display: grid; gap: 2px; place-items: center;
    transition: all .18s var(--ease);
  }
  .date-pill:hover:not(.on) { border-color: var(--accent); color: var(--accent); }
  .date-pill .dow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .date-pill .dnum {
    font-family: 'Instrument Serif', serif;
    font-size: 22px; line-height: 1; letter-spacing: -0.015em;
    color: var(--ink);
  }
  .date-pill .mth {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
  }
  .date-pill.today .dow { color: var(--accent); }
  .date-pill.on {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 6px 14px -8px rgba(30,127,71,0.55);
  }
  .date-pill.on .dow,
  .date-pill.on .dnum,
  .date-pill.on .mth { color: #fff; }

  /* ---------- Slot grid ---------- */
  .slot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 6px;
    margin-top: 10px;
  }
  @media (min-width: 960px) {
    .slot-grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }
  }

  .slot {
    appearance: none; background: var(--panel);
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font: inherit; font-size: 13px; font-weight: 500;
    letter-spacing: -0.005em;
    padding: 10px 4px;
    border-radius: 10px;
    cursor: pointer;
    display: grid; gap: 2px; place-items: center;
    transition: all .16s var(--ease);
    font-variant-numeric: tabular-nums;
  }
  .slot .s-time { letter-spacing: 0; }
  .slot .s-dur {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
  }
  .slot:hover:not(.taken):not(.on) {
    background: rgba(182,228,195,0.25);
    transform: translateY(-1px);
    box-shadow: 0 6px 14px -8px rgba(30,127,71,0.35);
  }
  .slot.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 8px 18px -10px rgba(30,127,71,0.65);
  }
  .slot.on .s-dur { color: rgba(255,255,255,0.75); }
  .slot.taken {
    background: var(--field);
    border: 1.5px solid var(--line);
    color: var(--muted);
    cursor: not-allowed;
    position: relative;
  }
  .slot.taken::after {
    content: "";
    position: absolute; left: 8px; right: 8px; top: 50%;
    height: 1px; background: var(--line-2);
    transform: rotate(-10deg);
    opacity: 0.8;
  }
  .slot.taken .s-dur { color: var(--muted); }

  .slot-legend {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
  }
  .leg { display: inline-flex; align-items: center; gap: 6px; }
  .leg-swatch { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--accent); background: var(--panel); }
  .leg-swatch.on { background: var(--accent); }
  .leg-swatch.taken { background: var(--field); border-color: var(--line); }

  /* ---------- Summary row (pre-CTA) ---------- */
  .summary-card {
    margin: 16px;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px dashed var(--line-2);
    border-radius: var(--radius);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  @media (min-width: 960px) {
    .summary-card { margin: 0; }
  }
  .summary-card .sc-cell { display: grid; gap: 2px; min-width: 0; }
  .summary-card .sc-cell .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .summary-card .sc-cell .val {
    font-size: 14px; font-weight: 500; color: var(--ink);
    letter-spacing: -0.005em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .summary-card .sc-cell .val.placeholder { color: var(--muted); font-weight: 400; font-style: italic; font-family: 'Instrument Serif', serif; font-size: 15px; }

  /* ---------- Sticky bottom CTA ---------- */
  .sticky-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    background: rgba(255,255,255,0.94);
    backdrop-filter: saturate(1.2) blur(14px);
    -webkit-backdrop-filter: saturate(1.2) blur(14px);
    border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .sticky-bar-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex; align-items: center; gap: 12px;
  }
  .sticky-price {
    display: grid; gap: 2px;
    min-width: 0; flex: 1;
  }
  .sticky-price .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .sticky-price .val {
    font-family: 'Instrument Serif', serif;
    font-size: 22px; line-height: 1.1; letter-spacing: -0.015em;
    color: var(--ink);
  }
  .sticky-price .val em { font-style: italic; color: var(--accent); }
  .sticky-price .val.muted { color: var(--muted); }

  .btn-confirm {
    appearance: none; border: 0; font: inherit;
    background: var(--accent);
    color: #fff;
    padding: 14px 22px;
    font-size: 15px; font-weight: 500;
    border-radius: var(--radius);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 10px;
    box-shadow: var(--shadow-btn);
    transition: background .2s var(--ease), transform .12s var(--ease), box-shadow .2s var(--ease);
    letter-spacing: -0.005em;
    flex: none;
  }
  .btn-confirm:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-confirm:active:not(:disabled) { transform: translateY(1px); }
  .btn-confirm:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
    background: var(--field);
    color: var(--muted);
  }
  .btn-confirm .arrow { transition: transform .2s var(--ease); }
  .btn-confirm:hover:not(:disabled) .arrow { transform: translateX(3px); }

  /* ---------- Toast ---------- */
  .toast-wrap {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    pointer-events: none;
    width: min(calc(100vw - 32px), 420px);
  }
  .toast {
    background: var(--dark-bg);
    color: var(--dark-ink);
    border: 1px solid rgba(182,228,195,0.18);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    display: flex; gap: 12px; align-items: flex-start;
    box-shadow: 0 20px 50px -20px rgba(14,26,18,0.55), 0 0 0 1px rgba(14,26,18,0.02);
    pointer-events: auto;
    opacity: 0;
    transform: translateY(-12px) scale(0.98);
    animation: toastIn .35s var(--ease) forwards;
    position: relative;
    overflow: hidden;
  }
  .toast::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(120% 80% at 0% 0%, rgba(47,174,98,0.22) 0%, rgba(14,26,18,0) 55%);
    pointer-events: none;
  }
  .toast.leaving { animation: toastOut .3s var(--ease) forwards; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-12px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateY(-12px) scale(0.98); }
  }
  .toast-ico {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: rgba(182,228,195,0.18);
    color: var(--accent-3);
    display: grid; place-items: center;
    flex: none;
    border: 1px solid rgba(182,228,195,0.18);
    position: relative; z-index: 1;
  }
  .toast-check {
    animation: checkPop .4s .1s var(--ease) backwards;
  }
  @keyframes checkPop {
    from { transform: scale(0.3); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .toast-body { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .toast-title {
    font-family: 'Instrument Serif', serif;
    font-size: 18px; line-height: 1.15; letter-spacing: -0.015em;
    color: var(--dark-ink);
  }
  .toast-title em { font-style: italic; color: var(--accent-3); }
  .toast-sub {
    margin-top: 2px;
    font-size: 12.5px; line-height: 1.4;
    color: rgba(234,243,236,0.72);
  }
  .toast-sub .mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent-3);
  }
  .toast-progress {
    position: absolute; bottom: 0; left: 0;
    height: 2px;
    background: var(--accent-2);
    width: 100%;
    transform-origin: left;
    animation: toastProg 3.6s linear forwards;
    z-index: 1;
  }
  @keyframes toastProg { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* ---------- Reveal ---------- */
  .reveal > * { opacity: 0; transform: translateY(8px); animation: reveal .5s var(--ease) forwards; }
  .reveal > *:nth-child(1) { animation-delay: .04s; }
  .reveal > *:nth-child(2) { animation-delay: .10s; }
  .reveal > *:nth-child(3) { animation-delay: .16s; }
  .reveal > *:nth-child(4) { animation-delay: .22s; }
  .reveal > *:nth-child(5) { animation-delay: .28s; }
  @keyframes reveal { to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body data-screen-label="Station Booking">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* =============================================================
   MOCK DATA — replace with API call when backend is ready.

   // TODO (backend integration):
   //   const res = await fetch(`/api/stations/${id}`);
   //   const { station, chargers } = await res.json();
   //   const slotRes = await fetch(`/api/chargers/${chargerId}/slots?date=${dateIso}`);
   //   const { slots } = await slotRes.json();
   ============================================================= */

const MOCK_STATION = {
  id: 'EVC-2041',
  name: 'Green Park Charger',
  address: '88 Sukhumvit Soi 24, Khlong Tan, Bangkok 10110',
  status: 'active',
  operator: 'EV Charger Network',
};

const MOCK_CHARGERS = [
  {
    id: 'CHG-A01',
    typeName: 'CCS Combo 2',
    standard: 'DC',          // AC | DC
    maxKw: 150,
    ratePerKwh: 8.5,         // THB per kWh
    status: 'available',     // available | busy | offline
    connectorIcon: 'ccs',
  },
  {
    id: 'CHG-A02',
    typeName: 'CHAdeMO',
    standard: 'DC',
    maxKw: 50,
    ratePerKwh: 7.9,
    status: 'busy',
    connectorIcon: 'chademo',
  },
  {
    id: 'CHG-B01',
    typeName: 'Type 2 AC',
    standard: 'AC',
    maxKw: 22,
    ratePerKwh: 6.5,
    status: 'available',
    connectorIcon: 'type2',
  },
  {
    id: 'CHG-B02',
    typeName: 'Type 2 AC',
    standard: 'AC',
    maxKw: 11,
    ratePerKwh: 5.9,
    status: 'offline',
    connectorIcon: 'type2',
  },
];

/* 45-minute slots from 08:00 to 22:00 — taken flags keyed by charger+date */
function buildSlotsFor(chargerId, dateIso) {
  const slots = [];
  const start = new Date(`${dateIso}T08:00:00`);
  const end = new Date(`${dateIso}T22:00:00`);
  let cur = new Date(start);
  // Deterministic pseudo-random "taken" pattern per charger+date
  let seed = (chargerId.charCodeAt(4) * 31 + dateIso.charCodeAt(8) * 17) >>> 0;
  const rnd = () => { seed = (seed * 1103515245 + 12345) >>> 0; return (seed / 0xffffffff); };
  while (cur < end) {
    const iso = cur.toISOString();
    const hh = String(cur.getHours()).padStart(2, '0');
    const mm = String(cur.getMinutes()).padStart(2, '0');
    const taken = rnd() < 0.32;
    slots.push({
      startIso: iso,
      label: `${hh}:${mm}`,
      durationMin: 45,
      taken,
    });
    cur = new Date(cur.getTime() + 45 * 60 * 1000);
  }
  return slots;
}

/* Today + next 6 days */
function buildDates() {
  const out = [];
  const today = new Date();
  today.setHours(0,0,0,0);
  for (let i = 0; i < 7; i++) {
    const d = new Date(today.getTime() + i * 86400000);
    const iso = d.toISOString().slice(0, 10);
    out.push({
      iso,
      date: d,
      dow: d.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase(),
      dnum: d.getDate(),
      mth: d.toLocaleDateString('en-US', { month: 'short' }).toUpperCase(),
      isToday: i === 0,
    });
  }
  return out;
}

/* ============ Icons ============ */
const Ico = {
  ArrowLeft:  (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  ArrowRight: (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  Pin:        (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.5 7-13a7 7 0 10-14 0c0 5.5 7 13 7 13z" stroke="currentColor" strokeWidth="1.8"/><circle cx="12" cy="9" r="2.5" stroke="currentColor" strokeWidth="1.8"/></svg>,
  Bolt:       (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/></svg>,
  Plug:       (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M8 2v4M16 2v4M7 6h10v5a5 5 0 01-10 0V6zM12 16v5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  Check:      (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  Info:       (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="1.8"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,
  Clock:      (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,
};

/* ============ Charger Card ============ */
function ChargerCard({ c, selected, onSelect }) {
  const unavailable = c.status === 'offline';
  const busy = c.status === 'busy';
  const statusBadge =
    c.status === 'available' ? <span className="badge-status-ok">Available</span> :
    busy                     ? <span className="badge-status-busy">In use</span> :
                               <span className="badge-status-off">Offline</span>;

  return (
    <article
      className={`charger ${selected ? 'selected' : ''} ${unavailable ? 'unavailable' : ''}`}
      data-charger-id={c.id}
      id={`charger-${c.id}`}
    >
      <div className="ch-top">
        <div className="ch-icon" aria-hidden="true">
          {c.standard === 'DC' ? <Ico.Bolt width="22" height="22"/> : <Ico.Plug width="22" height="22"/>}
        </div>
        <div className="ch-head">
          <div className="ch-name">
            <span>{c.typeName}</span>
            <span className="ch-code">{c.id}</span>
          </div>
          <div className="ch-type-row">
            <span className={c.standard === 'DC' ? 'badge-dc' : 'badge-ac'}>{c.standard}</span>
            {statusBadge}
            {c.standard === 'DC' && <span className="badge">Fast charge</span>}
          </div>
        </div>
      </div>

      <div className="ch-meta">
        <div className="meta-cell">
          <span className="lbl">Max power</span>
          <span className="val" data-field="maxKw">{c.maxKw}<small>kW</small></span>
        </div>
        <div className="meta-cell">
          <span className="lbl">Rate</span>
          <span className="val" data-field="ratePerKwh">฿{c.ratePerKwh.toFixed(1)}<small>/ kWh</small></span>
        </div>
      </div>

      <div className="ch-foot">
        <button
          className="select-btn"
          data-action="select-charger"
          data-charger-id={c.id}
          disabled={unavailable}
          onClick={() => onSelect(c.id)}
          aria-pressed={selected}
        >
          {selected ? 'Selected' : (busy ? 'Select · queue' : 'Select')}
          {!selected && <Ico.ArrowRight className="arrow" width="14" height="14"/>}
        </button>
      </div>
    </article>
  );
}

/* ============ Date pills ============ */
function DatePills({ dates, selected, onPick }) {
  return (
    <div className="date-pills" role="tablist" aria-label="Choose date">
      {dates.map(d => {
        const on = d.iso === selected;
        return (
          <button
            key={d.iso}
            className={`date-pill ${on ? 'on' : ''} ${d.isToday ? 'today' : ''}`}
            role="tab"
            aria-selected={on}
            data-date={d.iso}
            onClick={() => onPick(d.iso)}
          >
            <span className="dow">{d.isToday ? 'Today' : d.dow}</span>
            <span className="dnum">{d.dnum}</span>
            <span className="mth">{d.mth}</span>
          </button>
        );
      })}
    </div>
  );
}

/* ============ Slot grid ============ */
function SlotGrid({ slots, selectedIso, onPick }) {
  return (
    <>
      <div className="slot-grid" role="listbox" aria-label="45-minute time slots">
        {slots.map(s => {
          const on = s.startIso === selectedIso;
          return (
            <button
              key={s.startIso}
              className={`slot ${s.taken ? 'taken' : ''} ${on ? 'on' : ''}`}
              data-slot-start={s.startIso}
              data-slot-taken={s.taken ? 'true' : 'false'}
              aria-disabled={s.taken}
              disabled={s.taken}
              onClick={() => !s.taken && onPick(s.startIso)}
              role="option"
              aria-selected={on}
            >
              <span className="s-time">{s.label}</span>
              <span className="s-dur">45 min</span>
            </button>
          );
        })}
      </div>
      <div className="slot-legend" aria-hidden="true">
        <span className="leg"><span className="leg-swatch"/> Available</span>
        <span className="leg"><span className="leg-swatch on"/> Selected</span>
        <span className="leg"><span className="leg-swatch taken"/> Taken</span>
      </div>
    </>
  );
}

/* ============ Toast ============ */
function Toast({ payload, onClose }) {
  const [leaving, setLeaving] = useState(false);
  useEffect(() => {
    const t1 = setTimeout(() => setLeaving(true), 3600);
    const t2 = setTimeout(() => onClose(), 3950);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [payload.key, onClose]);
  return (
    <div className="toast-wrap" role="status" aria-live="polite">
      <div className={`toast ${leaving ? 'leaving' : ''}`} id="booking-toast" data-toast="success">
        <div className="toast-ico" aria-hidden="true">
          <span className="toast-check"><Ico.Check width="20" height="20"/></span>
        </div>
        <div className="toast-body">
          <div className="toast-title">Booking <em>confirmed.</em></div>
          <div className="toast-sub">
            <span className="mono">{payload.chargerId}</span> · {payload.dateLabel} · {payload.timeLabel}
            <div style={{ marginTop: 2 }}>See you at {MOCK_STATION.name.split(' ').slice(0,2).join(' ')}. A reminder will land 15 min before.</div>
          </div>
        </div>
        <div className="toast-progress" aria-hidden="true"/>
      </div>
    </div>
  );
}

/* ============ App ============ */
function App() {
  const dates = useMemo(() => buildDates(), []);
  const [selectedCharger, setSelectedCharger] = useState(null);
  const [selectedDate, setSelectedDate] = useState(dates[0].iso);
  const [selectedSlot, setSelectedSlot] = useState(null);
  const [toast, setToast] = useState(null);

  // slots depend on charger + date
  const slots = useMemo(() => {
    if (!selectedCharger) return [];
    return buildSlotsFor(selectedCharger, selectedDate);
  }, [selectedCharger, selectedDate]);

  // Reset slot when charger or date changes
  useEffect(() => { setSelectedSlot(null); }, [selectedCharger, selectedDate]);

  const chargerObj = MOCK_CHARGERS.find(c => c.id === selectedCharger);
  const slotObj = slots.find(s => s.startIso === selectedSlot);
  const dateObj = dates.find(d => d.iso === selectedDate);

  const canConfirm = !!(selectedCharger && selectedSlot);

  function handleConfirm() {
    if (!canConfirm) return;
    setToast({
      key: Date.now(),
      chargerId: selectedCharger,
      dateLabel: dateObj.isToday ? 'Today' : `${dateObj.dow.charAt(0)+dateObj.dow.slice(1).toLowerCase()} ${dateObj.dnum}`,
      timeLabel: slotObj.label,
    });
    // reset selection after confirm (mock)
    setSelectedSlot(null);
  }

  // scroll booking panel into view on mobile after picking charger
  const bookingRef = useRef(null);
  useEffect(() => {
    if (selectedCharger && bookingRef.current && window.innerWidth < 960) {
      const el = bookingRef.current;
      setTimeout(() => {
        const y = el.getBoundingClientRect().top + window.scrollY - 72;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }, 120);
    }
  }, [selectedCharger]);

  return (
    <>
      <div className="app">
        {/* ===== Topbar ===== */}
        <header className="topbar">
          <button
            className="back-btn"
            id="back-btn"
            onClick={() => window.history.length > 1 ? window.history.back() : null}
            aria-label="Back to stations"
          >
            <span className="ico" aria-hidden="true"><Ico.ArrowLeft width="13" height="13"/></span>
            Back to stations
          </button>
          <a className="brand" href="#" aria-label="EV Charger home">
            <span className="brand-mark" aria-hidden="true">
              <svg width="13" height="15" viewBox="0 0 14 16" fill="none">
                <path d="M8 1L1 9h4l-1 6 7-8H7l1-6z" fill="#fff"/>
              </svg>
            </span>
            <span>EV Charger</span>
          </a>
        </header>

        {/* ===== Station header ===== */}
        <section className="station-head reveal" id="station-header" data-station-id={MOCK_STATION.id}>
          <span className="eyebrow">Station detail · {MOCK_STATION.id}</span>
          <h1 className="title">Green Park <em>Charger.</em></h1>
          <div className="st-addr-row">
            <Ico.Pin width="16" height="16"/>
            <span>{MOCK_STATION.address}</span>
          </div>
          <div className="head-meta">
            <span className="badge badge-dot badge-active">Open now</span>
            <span className="badge">4 chargers</span>
            <span className="badge">2 AC · 2 DC</span>
            <span className="badge">Operator · {MOCK_STATION.operator}</span>
          </div>
        </section>

        {/* ===== Main grid (columns on desktop) ===== */}
        <div className="main-grid">

          {/* LEFT: Chargers */}
          <div className="col-left">
            <div className="section-head">
              <div>
                <div className="sec-num">01 — Pick a charger</div>
                <h2>Choose your <em>connector.</em></h2>
              </div>
              <span className="hint">Tap · select</span>
            </div>

            <div className="charger-list reveal" id="charger-list">
              {MOCK_CHARGERS.map(c => (
                <ChargerCard
                  key={c.id}
                  c={c}
                  selected={selectedCharger === c.id}
                  onSelect={setSelectedCharger}
                />
              ))}
            </div>
          </div>

          {/* RIGHT: Booking panel */}
          <div className="col-right">
            <div className="section-head">
              <div>
                <div className="sec-num">02 — Pick a time</div>
                <h2>Today, or <em>soon.</em></h2>
              </div>
              <span className="hint">
                {selectedCharger ? `Charger · ${selectedCharger}` : 'Select charger first'}
              </span>
            </div>

            <div
              className={`booking-panel ${!selectedCharger ? 'disabled' : ''}`}
              id="booking-panel"
              ref={bookingRef}
              aria-disabled={!selectedCharger}
            >
              {!selectedCharger && (
                <div className="bp-hint">
                  <Ico.Info width="18" height="18"/>
                  <span><strong>Select a charger</strong> above to see available 45-minute slots for the next 7 days.</span>
                </div>
              )}

              <div className="bp-body">
                {/* Date pills */}
                <div>
                  <div className="bp-row-head">
                    <span className="lbl">Date</span>
                    <span className="sub">Next <em>7 days</em></span>
                  </div>
                  <DatePills dates={dates} selected={selectedDate} onPick={setSelectedDate}/>
                </div>

                {/* Slot grid */}
                <div>
                  <div className="bp-row-head">
                    <span className="lbl">45-min slots</span>
                    <span className="sub">
                      {selectedCharger
                        ? <>{slots.filter(s=>!s.taken).length} <em>open</em> · {slots.filter(s=>s.taken).length} taken</>
                        : 'Pick a charger'}
                    </span>
                  </div>
                  <SlotGrid
                    slots={slots.length ? slots : buildSlotsFor('CHG-A01', selectedDate)}
                    selectedIso={selectedSlot}
                    onPick={setSelectedSlot}
                  />
                </div>
              </div>
            </div>

            {/* Summary card */}
            <div className="summary-card" aria-label="Booking summary">
              <div className="sc-cell">
                <span className="lbl">Charger</span>
                <span className={`val ${chargerObj ? '' : 'placeholder'}`}>
                  {chargerObj ? `${chargerObj.typeName} · ${chargerObj.maxKw}kW` : 'not selected'}
                </span>
              </div>
              <div className="sc-cell">
                <span className="lbl">Date</span>
                <span className="val">
                  {dateObj.isToday ? 'Today' : `${dateObj.dow.charAt(0)+dateObj.dow.slice(1).toLowerCase()} ${dateObj.dnum} ${dateObj.mth.charAt(0)+dateObj.mth.slice(1).toLowerCase()}`}
                </span>
              </div>
              <div className="sc-cell">
                <span className="lbl">Time</span>
                <span className={`val ${slotObj ? '' : 'placeholder'}`}>
                  {slotObj ? `${slotObj.label} · 45 min` : 'not selected'}
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* ===== Sticky bottom CTA ===== */}
      <div className="sticky-bar" role="region" aria-label="Confirm booking bar">
        <div className="sticky-bar-inner">
          <div className="sticky-price">
            <span className="lbl">Estimated · 45 min @ max</span>
            <span className={`val ${chargerObj ? '' : 'muted'}`}>
              {chargerObj
                ? <>฿{(chargerObj.ratePerKwh * chargerObj.maxKw * 0.75).toFixed(0)} <em>/ session</em></>
                : '—'}
            </span>
          </div>
          <button
            id="confirm-booking"
            className="btn-confirm"
            data-action="confirm-booking"
            data-charger-id={selectedCharger || ''}
            data-slot-start={selectedSlot || ''}
            disabled={!canConfirm}
            onClick={handleConfirm}
          >
            Confirm Booking
            <Ico.ArrowRight className="arrow" width="16" height="16"/>
          </button>
        </div>
      </div>

      {/* ===== Toast ===== */}
      {toast && <Toast payload={toast} onClose={() => setToast(null)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
