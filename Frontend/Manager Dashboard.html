<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Manager Dashboard — EV Charger</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:#FAFBF7; --panel:#FFFFFF; --field:#F4F6EF;
    --ink:#0E1A12; --ink-2:#2A362D; --muted:#6B7668;
    --line:#E6E8DF; --line-2:#D8DCCE;
    --accent:#1E7F47; --accent-2:#2FAE62; --accent-3:#B6E4C3; --accent-ink:#0C3B1F; --accent-hover:#176B3B;
    --dark-bg:#0E1A12; --dark-bg-2:#0A130D; --dark-ink:#EAF3EC;
    --danger:#B4442A; --warning:#C58A2E;
    --radius-sm:8px; --radius:12px; --radius-lg:14px; --radius-xl:22px;
    --shadow-sm: 0 1px 0 rgba(14,26,18,.04);
    --shadow:    0 1px 0 rgba(14,26,18,.04), 0 12px 40px -12px rgba(14,26,18,.10);
    --shadow-btn:0 1px 0 rgba(255,255,255,0.1) inset, 0 10px 24px -12px rgba(30,127,71,0.55);
    --ring: 0 0 0 4px rgba(30,127,71,0.12);
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Inter Tight', ui-sans-serif, system-ui, sans-serif;
    font-feature-settings: "ss01","cv11";
    -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
  }

  /* =============== HEADER =============== */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(250,251,247,0.88);
    backdrop-filter: saturate(1.2) blur(12px);
    -webkit-backdrop-filter: saturate(1.2) blur(12px);
    border-bottom: 1px solid var(--line);
    padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  @media (max-width: 720px) { .topbar { padding: 12px 16px; } }

  .brand-row { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(160deg, var(--accent-2), var(--accent));
    display: grid; place-items: center;
    box-shadow: 0 0 0 1px rgba(14,26,18,0.04), inset 0 1px 0 rgba(255,255,255,0.25);
    flex: none;
  }
  .brand-name { font-weight: 500; font-size: 14.5px; letter-spacing: -0.01em; }
  .brand-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
    padding: 3px 7px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .crumb {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .crumb::before { content:""; width: 20px; height: 1px; background: var(--line-2); }
  @media (max-width: 900px) { .crumb { display: none; } }

  .top-actions { display: inline-flex; align-items: center; gap: 8px; }

  .icon-btn {
    appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink-2);
    width: 38px; height: 38px; border-radius: 10px;
    display: grid; place-items: center;
    cursor: pointer; position: relative;
    transition: all .18s var(--ease);
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn .dot-notice {
    position: absolute; top: 8px; right: 8px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent-2);
    border: 2px solid var(--panel);
    box-shadow: 0 0 0 0 rgba(47,174,98,0.4);
    animation: pulseDot 1.8s ease-in-out infinite;
  }
  @keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .user-chip {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 5px 10px 5px 5px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    cursor: pointer;
    transition: border-color .18s var(--ease);
  }
  .user-chip:hover { border-color: var(--line-2); }
  .user-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.02em;
  }
  .user-info { display: grid; gap: 1px; }
  .user-name { font-size: 13px; font-weight: 500; color: var(--ink); letter-spacing: -0.005em; line-height: 1.15; }
  .user-role {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); line-height: 1.15;
  }
  @media (max-width: 720px) { .user-info { display: none; } .user-chip { padding: 4px; } }

  .logout-btn {
    appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink-2);
    padding: 8px 12px; font: inherit; font-size: 12.5px; font-weight: 500;
    letter-spacing: -0.005em;
    border-radius: 10px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .18s var(--ease);
  }
  .logout-btn:hover { border-color: var(--danger); color: var(--danger); background: rgba(180,68,42,0.04); }

  /* =============== PAGE SHELL =============== */
  .page {
    max-width: 1320px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }
  @media (max-width: 720px) { .page { padding: 20px 16px 60px; } }

  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .page-head .titles { display: grid; gap: 6px; min-width: 0; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .eyebrow::before { content:""; width: 24px; height: 1px; background: var(--line-2); }

  h1.title {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: clamp(36px, 5vw, 52px); line-height: 1.02; letter-spacing: -0.02em;
    margin: 4px 0 0;
  }
  h1.title em { font-style: italic; color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 6px 0 0; max-width: 52ch; }

  .btn {
    appearance: none; border: 0; font: inherit;
    font-size: 14px; font-weight: 500; letter-spacing: -0.005em;
    padding: 12px 18px; border-radius: var(--radius);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all .18s var(--ease);
    text-decoration: none;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-btn); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-secondary { background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--ink-2); padding: 10px 12px; }
  .btn-ghost:hover:not(:disabled) { color: var(--accent); background: var(--field); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  .btn .arrow { transition: transform .2s var(--ease); }
  .btn:hover:not(:disabled) .arrow { transform: translateX(3px); }
  .btn-lg { padding: 14px 22px; font-size: 14.5px; }

  /* =============== SUMMARY METRICS =============== */
  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }
  @media (max-width: 960px) { .metrics { grid-template-columns: repeat(2, 1fr); } }

  .metric {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 18px 20px 16px;
    display: grid; gap: 10px;
    overflow: hidden;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .metric:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
  .metric .m-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .metric .m-lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
  }
  .metric .m-ico {
    width: 32px; height: 32px; border-radius: 9px;
    background: var(--field); color: var(--ink-2);
    display: grid; place-items: center;
    border: 1px solid var(--line);
  }
  .metric.accent .m-ico { background: rgba(182,228,195,0.35); color: var(--accent); border-color: rgba(30,127,71,0.2); }
  .metric .m-val {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 44px; line-height: 1; letter-spacing: -0.02em;
    color: var(--ink);
    display: inline-flex; align-items: baseline; gap: 6px;
  }
  .metric .m-val em { font-style: italic; color: var(--accent); }
  .metric .m-val .unit { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: var(--muted); font-style: normal; text-transform: uppercase; }
  .metric .m-trend {
    font-size: 12px; color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .metric .m-trend .delta {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 7px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.1em;
    background: rgba(182,228,195,0.35);
    color: var(--accent);
    border: 1px solid rgba(30,127,71,0.18);
    font-weight: 500;
  }
  .metric .m-trend .delta.down {
    background: rgba(180,68,42,0.08);
    color: var(--danger);
    border-color: rgba(180,68,42,0.22);
  }
  /* inline sparkline */
  .spark { width: 100%; height: 32px; display: block; }

  /* =============== STATIONS SECTION =============== */
  .sec-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 14px; margin-bottom: 14px; flex-wrap: wrap;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .sec-head .left { display: grid; gap: 4px; min-width: 0; }
  .sec-head .sec-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .sec-head .sec-num::before { content:""; width: 18px; height: 1px; background: var(--line-2); }
  .sec-head h2 {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 28px; line-height: 1.05; letter-spacing: -0.02em;
    margin: 2px 0 0;
  }
  .sec-head h2 em { font-style: italic; color: var(--accent); }

  .filter-row {
    display: flex; gap: 8px; margin-bottom: 20px;
    align-items: center; flex-wrap: wrap;
  }
  .filter-chip {
    appearance: none; font: inherit;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12.5px; font-weight: 500;
    letter-spacing: -0.005em;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .18s var(--ease);
  }
  .filter-chip:hover { color: var(--ink-2); border-color: var(--line-2); }
  .filter-chip.on { color: var(--accent); border-color: rgba(30,127,71,0.3); background: rgba(182,228,195,0.2); }
  .filter-chip .cnt {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em;
    background: var(--field); color: var(--muted);
    padding: 1px 6px; border-radius: 999px;
    min-width: 18px; text-align: center;
  }
  .filter-chip.on .cnt { background: rgba(30,127,71,0.15); color: var(--accent); }

  .search-wrap {
    flex: 1; max-width: 320px;
    display: flex; align-items: center; gap: 6px;
    padding: 0 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .search-wrap:focus-within { border-color: var(--accent); box-shadow: var(--ring); }
  .search-wrap input {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: 0;
    padding: 8px 0; font: inherit; font-size: 13px;
    color: var(--ink); letter-spacing: -0.005em;
  }
  .search-wrap svg { color: var(--muted); }

  .station-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  @media (max-width: 1100px) { .station-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px)  { .station-grid { grid-template-columns: 1fr; } }

  /* =============== STATION CARD =============== */
  .station {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 18px;
    display: grid; gap: 14px;
    transition: border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
    position: relative;
  }
  .station:hover { border-color: var(--line-2); transform: translateY(-2px); box-shadow: var(--shadow); }
  .station.off { opacity: 0.85; }
  .station.maint { }

  .st-top { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; }
  .st-title-wrap { display: grid; gap: 3px; min-width: 0; flex: 1; }
  .st-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .st-name {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 24px; line-height: 1.1; letter-spacing: -0.015em;
    color: var(--ink);
  }

  /* status toggle */
  .toggle-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .toggle-lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .toggle {
    appearance: none; border: 0;
    width: 44px; height: 24px; border-radius: 999px;
    background: var(--line-2);
    position: relative;
    cursor: pointer;
    transition: background .2s var(--ease);
    flex: none;
  }
  .toggle::after {
    content: "";
    position: absolute; top: 2px; left: 2px;
    width: 20px; height: 20px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 2px 4px rgba(14,26,18,0.2), 0 0 0 1px rgba(14,26,18,0.04);
    transition: transform .22s var(--ease);
  }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { transform: translateX(20px); }
  .toggle.maint { background: var(--warning); }
  .toggle.maint::after { transform: translateX(10px); background: #fff; }

  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    line-height: 1;
    color: var(--muted);
    background: var(--field);
    border: 1px solid var(--line);
    font-weight: 500;
  }
  .status-badge::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: currentColor;
  }
  .status-badge.on { color: var(--accent); background: rgba(182,228,195,0.3); border-color: rgba(30,127,71,0.2); }
  .status-badge.on::before { background: var(--accent-2); box-shadow: 0 0 0 2px rgba(47,174,98,0.22); animation: pulseDot 1.8s ease-in-out infinite; }
  .status-badge.off { color: var(--danger); background: rgba(180,68,42,0.08); border-color: rgba(180,68,42,0.22); }
  .status-badge.maint { color: var(--warning); background: rgba(197,138,46,0.12); border-color: rgba(197,138,46,0.28); }

  .st-addr {
    font-size: 13px; color: var(--muted); line-height: 1.4;
    display: flex; gap: 6px; align-items: flex-start;
  }
  .st-addr svg { color: var(--accent); flex: none; margin-top: 2px; }

  /* mini metric strip */
  .st-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .mini {
    padding: 10px 12px;
    background: var(--field);
    display: grid; gap: 2px;
  }
  .mini .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .mini .val {
    font-size: 18px; font-weight: 500; color: var(--ink);
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    display: inline-flex; align-items: baseline; gap: 3px;
  }
  .mini .val small { font-size: 10px; color: var(--muted); font-weight: 400; letter-spacing: 0.04em; }
  .mini .val.serif { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 22px; }
  .mini .val.serif em { font-style: italic; color: var(--accent); }

  /* bar visualizing available/busy/offline chargers */
  .charger-bar {
    display: flex;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    gap: 1px;
    background: var(--line);
  }
  .charger-bar span { display: block; height: 100%; }
  .cb-ok   { background: var(--accent-2); }
  .cb-busy { background: var(--warning); }
  .cb-off  { background: var(--danger); }
  .cb-legend {
    display: flex; flex-wrap: wrap; gap: 10px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }
  .cb-legend .dot { display:inline-block; width: 8px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

  .st-foot {
    display: flex; align-items: center; gap: 8px;
    margin-top: 2px;
  }
  .st-foot .btn-primary { flex: 1; }
  .icon-action {
    appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink-2);
    width: 40px; height: 40px; border-radius: 10px;
    display: grid; place-items: center;
    cursor: pointer;
    transition: all .18s var(--ease);
    flex: none;
  }
  .icon-action:hover { border-color: var(--accent); color: var(--accent); }

  /* add card */
  .add-card {
    background: var(--panel);
    border: 1px dashed var(--line-2);
    border-radius: var(--radius-lg);
    padding: 30px 18px;
    display: grid; place-items: center; gap: 10px;
    cursor: pointer;
    text-align: center;
    transition: all .2s var(--ease);
    min-height: 280px;
  }
  .add-card:hover {
    border-color: var(--accent); background: rgba(182,228,195,0.12);
    transform: translateY(-2px);
  }
  .add-card .add-ico {
    width: 52px; height: 52px;
    border-radius: 16px;
    background: rgba(182,228,195,0.35);
    color: var(--accent);
    display: grid; place-items: center;
    border: 1px solid rgba(30,127,71,0.18);
    transition: transform .22s var(--ease);
  }
  .add-card:hover .add-ico { transform: scale(1.06) rotate(90deg); }
  .add-card .t1 {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 22px; line-height: 1.1; letter-spacing: -0.015em;
    color: var(--ink);
  }
  .add-card .t1 em { font-style: italic; color: var(--accent); }
  .add-card .t2 { font-size: 12.5px; color: var(--muted); max-width: 28ch; line-height: 1.45; }

  /* =============== MODAL =============== */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(14,26,18,0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 20px;
    opacity: 0;
    animation: fadein .2s var(--ease) forwards;
  }
  @keyframes fadein { to { opacity: 1; } }
  .modal-backdrop.leaving { animation: fadeout .18s var(--ease) forwards; }
  @keyframes fadeout { to { opacity: 0; } }

  .modal {
    width: 100%; max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-xl);
    max-height: 92vh;
    overflow: auto;
    transform: translateY(14px);
    animation: sheetIn .3s var(--ease) forwards;
    position: relative;
    display: flex; flex-direction: column;
  }
  @keyframes sheetIn { to { transform: translateY(0); } }

  .modal-head {
    padding: 22px 24px 16px;
    border-bottom: 1px solid var(--line);

/* ============ Icons ============ */
const Ico = {

/* ============ Sparkline ============ */
function Sparkline({ seed = 1, color = 'var(--accent)' }) {
  const pts = useMemo(() => {
    let s = (seed * 9301 + 49297) % 233280;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const vals = [];
    let y = 50;
    for (let i = 0; i < 24; i++) {
      y += (rnd() - 0.45) * 20;
      y = Math.max(10, Math.min(90, y));
      vals.push(y);
    }
    return vals;
  }, [seed]);
  const w = 100, h = 100;
  const step = w / (pts.length - 1);
  const d = pts.map((y, i) => `${i === 0 ? 'M' : 'L'} ${(i * step).toFixed(2)} ${y.toFixed(2)}`).join(' ');
  const area = d + ` L ${w} ${h} L 0 ${h} Z`;
  return (
    <svg className="spark" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id={`sp-${seed}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.28"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#sp-${seed})`}/>
      <path d={d} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>
    </svg>
  );
}

/* ============ Metric card ============ */

      {spark ? <Sparkline seed={sparkSeed} color={accent ? 'var(--accent)' : '#6B7668'}/> : (
        <div className="m-trend">
          <span className={`delta ${deltaDir === 'down' ? 'down' : ''}`}>
            {deltaDir === 'down' ? '▾' : '▴'} {delta}

          <span>vs yesterday</span>

      )}

}

/* ============ Station Card ============ */

/* ============ Station Modal ============ */
function StationModal({ initial, onClose, onSave }) {
  const [leaving, setLeaving] = useState(false);
  const [form, setForm] = useState(initial || {
    id: '', name: '', address: '', latitude: '', longitude: '',
  });
  const isEdit = !!initial?.id;
  const nameRef = useRef(null);

  function close() {
    setLeaving(true);
    setTimeout(() => onClose(), 180);
  }

  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') close(); }
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    setTimeout(() => nameRef.current && nameRef.current.focus(), 100);
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, []);

  const valid =
    form.name.trim().length > 1 &&
    form.address.trim().length > 3 &&
    form.latitude !== '' && !isNaN(parseFloat(form.latitude)) &&
    form.longitude !== '' && !isNaN(parseFloat(form.longitude));

  function pickOnMap() {
    // Non-functional helper — fill with a Bangkok-ish location
    setForm(f => ({
      ...f,
      latitude: (13.72 + (Math.random() - 0.5) * 0.1).toFixed(4),
      longitude: (100.56 + (Math.random() - 0.5) * 0.1).toFixed(4),
    }));
  }

  function save() {
    if (!valid) return;
    onSave({
      ...form,
      latitude: parseFloat(form.latitude),
      longitude: parseFloat(form.longitude),
    });
  }

  return (
    <div
      className={`modal-backdrop ${leaving ? 'leaving' : ''}`}
      role="dialog" aria-modal="true" aria-labelledby="st-modal-title"
      id="station-modal"
      onClick={(e) => { if (e.target.classList.contains('modal-backdrop')) close(); }}
    >
      <div className="modal">
        <header className="modal-head">
          <div>
            <div className="mh-eyebrow">{isEdit ? `Edit · ${form.id}` : 'New station'}</div>
            <h2 id="st-modal-title">
              {isEdit ? <>Edit <em>station.</em></> : <>Add a <em>station.</em></>}
            </h2>
          </div>
          <button className="modal-close" aria-label="Close" onClick={close}>
            <Ico.Close width="16" height="16"/>
          </button>
        </header>

        <div className="modal-body">
          <div className="field">
            <label htmlFor="st-name">Station name</label>
            <div className="input-wrap">
              <input
                id="st-name"
                ref={nameRef}
                placeholder="e.g. Green Park Charger"
                value={form.name}
                onChange={(e) => setForm({...form, name: e.target.value})}
              />
            </div>
          </div>

          <div className="field">
            <label htmlFor="st-addr">Address <span className="hint">Full street address</span></label>
            <div className="input-wrap">
              <textarea
                id="st-addr"
                rows={2}
                placeholder="88 Sukhumvit Soi 24, Khlong Tan, Bangkok 10110"
                value={form.address}
                onChange={(e) => setForm({...form, address: e.target.value})}
              />
            </div>
          </div>

          <div className="row-2">
            <div className="field">
              <label htmlFor="st-lat">Latitude</label>
              <div className="input-wrap">
                <span className="prefix">N</span>
                <input
                  id="st-lat"
                  inputMode="decimal"
                  placeholder="13.7239"
                  value={form.latitude}
                  onChange={(e) => setForm({...form, latitude: e.target.value})}
                />
              </div>
            </div>
            <div className="field">
              <label htmlFor="st-lng">Longitude</label>
              <div className="input-wrap">
                <span className="prefix">E</span>
                <input
                  id="st-lng"
                  inputMode="decimal"
                  placeholder="100.5689"
                  value={form.longitude}
                  onChange={(e) => setForm({...form, longitude: e.target.value})}
                />
              </div>
            </div>
          </div>

          <button
            type="button"
            className="pick-on-map"
            data-action="pick-on-map"
            onClick={pickOnMap}
          >
            <span className="pm-ico" aria-hidden="true"><Ico.Crosshair width="16" height="16"/></span>
            <span className="pm-txt">
              <span className="pm-t1">Pick on map</span>
              <span className="pm-t2">Drop a pin and we'll fill the coordinates for you</span>
            </span>
            <Ico.ArrowRight width="16" height="16" style={{color: 'var(--accent)'}}/>
          </button>
        </div>

        <footer className="modal-foot">
          <button className="btn btn-secondary btn-lg" onClick={close}>Cancel</button>
          <button
            className="btn btn-primary btn-lg"
            data-action="save-station"
            disabled={!valid}
            onClick={save}
          >
            {isEdit ? 'Save changes' : 'Save station'}
          </button>
        </footer>
      </div>
    </div>
  );
}

/* ============ App ============ */
function App() {
  const [stations, setStations] = useState(INITIAL_STATIONS);
  const [filter, setFilter] = useState('all');
  const [query, setQuery] = useState('');
  const [modal, setModal] = useState(null); // null | { mode:'new' } | { mode:'edit', station }
  const [toast, setToast] = useState(null);

  // derived metrics
  const metrics = useMemo(() => {
    const totalBookings = stations.reduce((a,s) => a + s.todayBookings, 0);
    const totalRevenue = stations.reduce((a,s) => a + s.todayRevenue, 0);
    const activeCount = stations.filter(s => s.status === 'active').length;
    return {
      total: stations.length,
      active: activeCount,
      bookings: totalBookings,
      revenue: totalRevenue,
    };
  }, [stations]);

  const filtered = useMemo(() => {
    return stations.filter(s => {
      if (filter === 'active' && s.status !== 'active') return false;
      if (filter === 'inactive' && s.status !== 'inactive') return false;
      if (filter === 'maintenance' && s.status !== 'maintenance') return false;
      if (query && !(s.name.toLowerCase().includes(query.toLowerCase()) || s.id.toLowerCase().includes(query.toLowerCase()) || s.address.toLowerCase().includes(query.toLowerCase()))) return false;
      return true;
    });
  }, [stations, filter, query]);

  const counts = useMemo(() => ({
    all: stations.length,
    active: stations.filter(s => s.status === 'active').length,
    maintenance: stations.filter(s => s.status === 'maintenance').length,
    inactive: stations.filter(s => s.status === 'inactive').length,
  }), [stations]);

  function toggleStatus(id) {
    setStations(list => list.map(s => {
      if (s.id !== id) return s;
      const next = s.status === 'active' ? 'inactive' : 'active';
      return { ...s, status: next };
    }));
  }

  function saveStation(data) {
    if (data.id) {
      setStations(list => list.map(s => s.id === data.id ? { ...s, ...data } : s));
      flash(`Saved · ${data.name}`);
    } else {
      const id = 'EVC-' + Math.floor(2047 + Math.random() * 50);
      setStations(list => [
        {
          ...data, id, status: 'active',
          chargers: { total: 0, available: 0, busy: 0, offline: 0 },
          todayBookings: 0, todayRevenue: 0, utilization: 0,
        },
        ...list,
      ]);
      flash(`Created · ${id} · ${data.name}`);
    }
    setModal(null);
  }

  function flash(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2800);
  }

  return (
    <>
      {/* =============== Topbar =============== */}
      <header className="topbar">
        <div className="brand-row">
          <a className="brand" href="#">
            <span className="brand-mark" aria-hidden="true">
              <svg width="14" height="16" viewBox="0 0 14 16" fill="none">
                <path d="M8 1L1 9h4l-1 6 7-8H7l1-6z" fill="#fff"/>
              </svg>
            </span>
            <span className="brand-name">EV Charger</span>
          </a>
          <span className="brand-tag">Manager</span>
          <span className="crumb">Dashboard · Overview</span>
        </div>

        <div className="top-actions">
          <button className="icon-btn" aria-label="Notifications · 3 unread" title="Notifications">
            <Ico.Bell width="18" height="18"/>
            <span className="dot-notice" aria-hidden="true"/>
          </button>
          <div className="user-chip" role="button" aria-label="Account menu">
            <div className="user-avatar">{MANAGER.initials}</div>
            <div className="user-info">
              <span className="user-name">{MANAGER.name}</span>
              <span className="user-role">{MANAGER.role}</span>
            </div>
          </div>
          <button className="logout-btn" data-action="logout" onClick={() => flash('Logged out (mock)')}>
            <Ico.Logout width="14" height="14"/>
            <span style={{display:'none'}} className="hide-sm">Log out</span>
            Log out
          </button>
        </div>
      </header>

      {/* =============== Page =============== */}
      <div className="page">

        <div className="page-head">
          <div className="titles">
            <span className="eyebrow">Today · {new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</span>
            <h1 className="title">Good afternoon, <em>{MANAGER.name.split(' ')[0]}.</em></h1>
            <p className="sub">Live operations across your network — revenue, bookings, and station health at a glance.</p>
          </div>
          <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
            <button className="btn btn-secondary btn-lg" onClick={() => flash('Exporting CSV… (mock)')}>
              Export
            </button>
            <button
              className="btn btn-primary btn-lg"
              data-action="add-station"
              id="add-station-btn"
              onClick={() => setModal({ mode: 'new' })}
            >
              <Ico.Plus width="16" height="16"/>
              Add New Station
            </button>
          </div>
        </div>

        {/* =============== Summary Metrics =============== */}
        <div className="metrics reveal" aria-label="Summary metrics">
          <Metric
            lbl="Total stations"
            value={metrics.total}
            delta={`+1`}
            deltaDir="up"
            icon={<Ico.Station width="18" height="18"/>}
          />
          <Metric
            lbl="Active stations"
            value={`${metrics.active}/${metrics.total}`}
            delta={`${Math.round(metrics.active/metrics.total*100)}%`}
            deltaDir="up"
            icon={<Ico.Activity width="18" height="18"/>}
            accent
          />
          <Metric
            lbl="Today's bookings"
            value={metrics.bookings}
            unit="sessions"
            icon={<Ico.Calendar width="18" height="18"/>}
            spark
            sparkSeed={7}
          />
          <Metric
            lbl="Today's revenue"
            value={`฿${metrics.revenue.toLocaleString()}`}
            icon={<Ico.Cash width="18" height="18"/>}
            accent
            spark
            sparkSeed={42}
          />
        </div>

        {/* =============== Stations =============== */}
        <div className="sec-head">
          <div className="left">
            <span className="sec-num">01 — Stations</span>
            <h2>Your <em>network.</em></h2>
          </div>
        </div>

        <div className="filter-row">
          {[
            ['all', 'All'],
            ['active', 'Active'],
            ['maintenance', 'Maintenance'],
            ['inactive', 'Inactive'],
          ].map(([k, l]) => (
            <button
              key={k}
              className={`filter-chip ${filter===k?'on':''}`}
              data-filter={k}
              onClick={() => setFilter(k)}
            >
              {l}
              <span className="cnt">{counts[k]}</span>
            </button>
          ))}
          <div className="search-wrap" role="search">
            <Ico.Search width="14" height="14"/>
            <input
              type="search"
              placeholder="Search stations, IDs, addresses…"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              aria-label="Search stations"
            />
          </div>
        </div>

        <div className="station-grid" id="stations-grid">
          {filtered.length === 0 && (
            <div className="empty">
              <h3>No stations <em>match.</em></h3>
              <p>Try a different filter or clear the search to see all stations in your network.</p>
            </div>
          )}
          {filtered.map(s => (
            <StationCard
              key={s.id}
              s={s}
              onToggleStatus={toggleStatus}
              onEdit={(st) => setModal({ mode: 'edit', station: st })}
              onManageChargers={(id) => flash(`Open Charger Management for ${id}`)}
            />
          ))}
          {filter === 'all' && !query && (
            <button
              className="add-card"
              data-action="add-station"
              onClick={() => setModal({ mode: 'new' })}
              aria-label="Add new station"
            >
              <div className="add-ico" aria-hidden="true"><Ico.Plus width="22" height="22"/></div>
              <div className="t1">Add a <em>new station.</em></div>
              <div className="t2">Onboard a new location to your network — it takes under a minute.</div>
            </button>
          )}
        </div>

      </div>

      {/* =============== Modal =============== */}
      {modal && (
        <StationModal
          initial={modal.mode === 'edit' ? modal.station : null}
          onClose={() => setModal(null)}
          onSave={saveStation}
        />
      )}

      {toast && (
        <div className="toast-wrap" role="status" aria-live="polite">
          <div className="toast">
            <span className="tico" aria-hidden="true"><Ico.Check width="16" height="16"/></span>
            <span>{toast}</span>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
