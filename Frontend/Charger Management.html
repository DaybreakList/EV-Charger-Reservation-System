<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Charger Management — EV Charger</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:#FAFBF7; --panel:#FFFFFF; --field:#F4F6EF;
    --ink:#0E1A12; --ink-2:#2A362D; --muted:#6B7668;
    --line:#E6E8DF; --line-2:#D8DCCE;
    --accent:#1E7F47; --accent-2:#2FAE62; --accent-3:#B6E4C3; --accent-ink:#0C3B1F; --accent-hover:#176B3B;
    --dark-bg:#0E1A12; --dark-ink:#EAF3EC;
    --danger:#B4442A; --danger-2:#D45A3C; --warning:#C58A2E;
    --radius-sm:8px; --radius:12px; --radius-lg:14px; --radius-xl:22px;
    --shadow-sm: 0 1px 0 rgba(14,26,18,.04);
    --shadow:    0 1px 0 rgba(14,26,18,.04), 0 12px 40px -12px rgba(14,26,18,.10);
    --shadow-btn:0 1px 0 rgba(255,255,255,0.1) inset, 0 10px 24px -12px rgba(30,127,71,0.55);
    --ring: 0 0 0 4px rgba(30,127,71,0.12);
    --ring-danger: 0 0 0 4px rgba(180,68,42,0.14);
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Inter Tight', ui-sans-serif, system-ui, sans-serif;
    font-feature-settings: "ss01","cv11";
    -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
  }

  /* =============== HEADER =============== */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(250,251,247,0.88);
    backdrop-filter: saturate(1.2) blur(12px);
    -webkit-backdrop-filter: saturate(1.2) blur(12px);
    border-bottom: 1px solid var(--line);
    padding: 12px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  @media (max-width: 720px) { .topbar { padding: 12px 16px; } }
  .brand-row { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(160deg, var(--accent-2), var(--accent));
    display: grid; place-items: center; flex: none;
    box-shadow: 0 0 0 1px rgba(14,26,18,0.04), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .brand-name { font-weight: 500; font-size: 14.5px; letter-spacing: -0.01em; }
  .brand-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
    padding: 3px 7px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  .top-actions { display: inline-flex; align-items: center; gap: 8px; }
  .icon-btn {
    appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink-2);
    width: 38px; height: 38px; border-radius: 10px;
    display: grid; place-items: center; cursor: pointer; position: relative;
    transition: all .18s var(--ease);
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .user-chip {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 5px 10px 5px 5px;
    border: 1px solid var(--line);
    border-radius: 999px; background: var(--panel);
  }
  .user-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 500; letter-spacing: 0.02em;
  }
  .user-info { display: grid; gap: 1px; }
  .user-name { font-size: 13px; font-weight: 500; color: var(--ink); line-height: 1.15; }
  .user-role {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); line-height: 1.15;
  }
  @media (max-width: 720px) { .user-info { display: none; } .user-chip { padding: 4px; } }

  /* =============== PAGE SHELL =============== */
  .page {
    max-width: 1280px; margin: 0 auto;
    padding: 24px 24px 80px;
  }
  @media (max-width: 720px) { .page { padding: 18px 16px 60px; } }

  /* Breadcrumb */
  .crumbs {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .crumbs a { color: var(--muted); text-decoration: none; transition: color .15s var(--ease); }
  .crumbs a:hover { color: var(--accent); }
  .crumbs .sep { color: var(--line-2); }
  .crumbs .here { color: var(--ink); }

  /* Station info card */
  .station-head {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-xl);
    padding: 22px 24px;
    display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
    position: relative; overflow: hidden;
  }
  .station-head::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 92% 0%, rgba(182,228,195,0.4) 0%, transparent 55%),
      radial-gradient(circle at 0% 100%, rgba(244,246,239,0.9) 0%, transparent 40%);
    pointer-events: none;
  }
  .sh-left { display: grid; gap: 6px; min-width: 0; position: relative; }
  .sh-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .sh-eyebrow::before { content:""; width: 24px; height: 1px; background: var(--line-2); }
  .sh-name {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: clamp(30px, 4vw, 42px); line-height: 1.05; letter-spacing: -0.02em;
    margin: 0;
  }
  .sh-name em { font-style: italic; color: var(--accent); }
  .sh-addr {
    color: var(--muted); font-size: 14px; line-height: 1.5;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .sh-addr svg { color: var(--accent); flex: none; }
  .sh-meta {
    display: flex; flex-wrap: wrap; gap: 20px 28px;
    position: relative;
  }
  .sh-meta .cell { display: grid; gap: 2px; }
  .sh-meta .cell .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .sh-meta .cell .val {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 26px; line-height: 1; letter-spacing: -0.01em;
    color: var(--ink);
  }
  .sh-meta .cell .val em { font-style: italic; color: var(--accent); }

  .btn {
    appearance: none; border: 0; font: inherit;
    font-size: 14px; font-weight: 500; letter-spacing: -0.005em;
    padding: 12px 18px; border-radius: var(--radius);
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all .18s var(--ease);
    text-decoration: none; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-btn); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-secondary { background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: var(--danger); color: #fff; box-shadow: 0 10px 24px -12px rgba(180,68,42,0.55); }
  .btn-danger:hover:not(:disabled) { background: #9B3923; }
  .btn-ghost { background: transparent; color: var(--ink-2); padding: 10px 12px; }
  .btn-ghost:hover:not(:disabled) { color: var(--accent); background: var(--field); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  .btn .arrow { transition: transform .2s var(--ease); }
  .btn:hover:not(:disabled) .arrow { transform: translateX(3px); }
  .btn-lg { padding: 14px 22px; font-size: 14.5px; }

  /* Section header */
  .sec-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 14px; margin-bottom: 14px; flex-wrap: wrap;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .sec-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .sec-num::before { content:""; width: 18px; height: 1px; background: var(--line-2); }
  .sec-head h2 {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 28px; line-height: 1.05; letter-spacing: -0.02em;
    margin: 2px 0 0;
  }
  .sec-head h2 em { font-style: italic; color: var(--accent); }

  .filter-row {
    display: flex; gap: 8px; margin-bottom: 18px;
    align-items: center; flex-wrap: wrap;
  }
  .filter-chip {
    appearance: none; font: inherit;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 999px;
    font-size: 12.5px; font-weight: 500;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .18s var(--ease);
  }
  .filter-chip:hover { color: var(--ink-2); border-color: var(--line-2); }
  .filter-chip.on { color: var(--accent); border-color: rgba(30,127,71,0.3); background: rgba(182,228,195,0.2); }
  .filter-chip .cnt {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em;
    background: var(--field); color: var(--muted);
    padding: 1px 6px; border-radius: 999px; min-width: 18px; text-align: center;
  }
  .filter-chip.on .cnt { background: rgba(30,127,71,0.15); color: var(--accent); }

  /* =============== TABLE =============== */
  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  @media (max-width: 900px) { .table-wrap { border: 0; background: transparent; } }

  .table {
    width: 100%;
    border-collapse: collapse;
  }
  @media (max-width: 900px) { .table { display: none; } }
  .table th, .table td {
    text-align: left;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  .table tr:last-child td { border-bottom: 0; }
  .table thead th {
    background: var(--field);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); font-weight: 500;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  .table tbody tr { transition: background .15s var(--ease); }
  .table tbody tr:hover { background: rgba(244,246,239,0.55); }

  .ch-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px; letter-spacing: 0.04em;
    color: var(--ink); font-weight: 500;
  }
  .ch-type-cell { display: flex; align-items: center; gap: 10px; }
  .ch-type-ico {
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--field); color: var(--ink-2);
    display: grid; place-items: center; border: 1px solid var(--line); flex: none;
  }
  .ch-type-ico.dc { background: rgba(30,127,71,0.08); color: var(--accent); border-color: rgba(30,127,71,0.2); }
  .ch-type-ico.ac { background: rgba(197,138,46,0.1); color: var(--warning); border-color: rgba(197,138,46,0.28); }
  .ch-type-name {
    font-size: 14px; font-weight: 500; color: var(--ink);
    line-height: 1.2;
  }
  .ch-type-connector {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.1em;
    color: var(--muted); text-transform: uppercase;
    margin-top: 1px;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 500; line-height: 1;
  }
  .badge.ac { background: rgba(197,138,46,0.1); color: var(--warning); border: 1px solid rgba(197,138,46,0.28); }
  .badge.dc { background: rgba(30,127,71,0.08); color: var(--accent); border: 1px solid rgba(30,127,71,0.22); }

  .power {
    font-variant-numeric: tabular-nums;
    font-size: 14px; color: var(--ink);
  }
  .power em {
    font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400;
    font-size: 18px; color: var(--accent);
    margin-right: 2px;
  }

  /* Inline rate editor */
  .rate-cell {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s var(--ease);
    background: transparent;
    min-width: 110px;
  }
  .rate-cell:hover { border-color: var(--line-2); background: var(--field); }
  .rate-cell.editing {
    border-color: var(--accent);
    box-shadow: var(--ring);
    background: #fff;
    cursor: text;
  }
  .rate-cell .unit {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em;
    color: var(--muted); text-transform: uppercase;
  }
  .rate-cell .val {
    font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400;
    font-size: 20px; color: var(--ink);
    letter-spacing: -0.01em;
    min-width: 36px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .rate-cell input {
    appearance: none; border: 0; outline: 0; background: transparent;
    font: inherit;
    font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400;
    font-size: 20px; color: var(--ink);
    width: 60px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .rate-cell .pencil { color: var(--muted); opacity: 0; transition: opacity .15s var(--ease); }
  .rate-cell:hover .pencil { opacity: 1; }
  .rate-cell .suffix {
    font-size: 11px; color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  /* Status toggle (reused) */
  .status-cell { display: flex; align-items: center; gap: 10px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 500; line-height: 1;
    background: var(--field); color: var(--muted); border: 1px solid var(--line);
  }
  .status-pill::before { content:""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .status-pill.on { color: var(--accent); background: rgba(182,228,195,0.3); border-color: rgba(30,127,71,0.2); }
  .status-pill.on::before { background: var(--accent-2); box-shadow: 0 0 0 2px rgba(47,174,98,0.22); animation: pulseDot 1.8s ease-in-out infinite; }
  .status-pill.in-use { color: var(--warning); background: rgba(197,138,46,0.12); border-color: rgba(197,138,46,0.28); }
  .status-pill.in-use::before { background: var(--warning); }
  .status-pill.off { color: var(--danger); background: rgba(180,68,42,0.08); border-color: rgba(180,68,42,0.22); }
  @keyframes pulseDot { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .toggle {
    appearance: none; border: 0;
    width: 40px; height: 22px; border-radius: 999px;
    background: var(--line-2);
    position: relative; cursor: pointer;
    transition: background .2s var(--ease);
    flex: none;
  }
  .toggle::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px;
    background: #fff; border-radius: 50%;
    box-shadow: 0 2px 4px rgba(14,26,18,0.2), 0 0 0 1px rgba(14,26,18,0.04);
    transition: transform .22s var(--ease);
  }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { transform: translateX(18px); }
  .toggle:disabled { opacity: 0.55; cursor: not-allowed; }

  .row-actions { display: inline-flex; gap: 6px; }
  .icon-action {
    appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink-2);
    width: 34px; height: 34px; border-radius: 9px;
    display: grid; place-items: center; cursor: pointer;
    transition: all .15s var(--ease); flex: none;
  }
  .icon-action:hover { border-color: var(--accent); color: var(--accent); }
  .icon-action.danger:hover { border-color: var(--danger); color: var(--danger); background: rgba(180,68,42,0.04); }

  /* =============== MOBILE CARDS =============== */
  .card-list {
    display: none;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (max-width: 900px) {
    .card-list { display: grid; }
  }
  .cg-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: grid; gap: 12px;
  }
  .cg-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .cg-kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .cg-kv .cell { display: grid; gap: 2px; }
  .cg-kv .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
  }
  .cg-foot { display: flex; gap: 6px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

  /* Add-charger card-at-end */
  .add-card {
    background: var(--panel);
    border: 1px dashed var(--line-2);
    border-radius: var(--radius-lg);
    padding: 22px;
    display: flex; gap: 14px; align-items: center;
    cursor: pointer;
    transition: all .2s var(--ease);
    margin-top: 12px;
    text-align: left;
    width: 100%;
    font: inherit;
  }
  .add-card:hover {
    border-color: var(--accent); background: rgba(182,228,195,0.12);
  }
  .add-card .add-ico {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(182,228,195,0.35);
    color: var(--accent);
    display: grid; place-items: center;
    border: 1px solid rgba(30,127,71,0.18); flex: none;
    transition: transform .22s var(--ease);
  }
  .add-card:hover .add-ico { transform: scale(1.06) rotate(90deg); }
  .add-card .t1 {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 22px; line-height: 1.1; letter-spacing: -0.015em;
    color: var(--ink);
  }
  .add-card .t1 em { font-style: italic; color: var(--accent); }
  .add-card .t2 { font-size: 12.5px; color: var(--muted); }

  /* =============== MODAL =============== */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(14,26,18,0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 50;
    display: grid; place-items: center;
    padding: 20px;
    opacity: 0;
    animation: fadein .2s var(--ease) forwards;
  }
  @keyframes fadein { to { opacity: 1; } }
  .modal-backdrop.leaving { animation: fadeout .18s var(--ease) forwards; }
  @keyframes fadeout { to { opacity: 0; } }
  .modal {
    width: 100%; max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-xl);
    max-height: 92vh;
    overflow: auto;
    transform: translateY(14px);
    animation: sheetIn .3s var(--ease) forwards;
    display: flex; flex-direction: column;
  }
  @keyframes sheetIn { to { transform: translateY(0); } }
  .modal.sm { max-width: 440px; }

  .modal-head {
    padding: 22px 24px 16px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
  }
  .mh-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted);
  }
  .modal-head h2 {
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 28px; line-height: 1.08; letter-spacing: -0.02em;
    margin: 4px 0 0;
  }
  .modal-head h2 em { font-style: italic; color: var(--accent); }
  .modal-head h2 em.danger { color: var(--danger); }
  .modal-close {
    appearance: none; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink-2);
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; flex: none;
    transition: all .18s var(--ease);
  }
  .modal-close:hover { border-color: var(--ink-2); color: var(--ink); }
  .modal-body { padding: 20px 24px; display: grid; gap: 14px; }
  .modal-foot {
    padding: 14px 24px 18px;
    border-top: 1px solid var(--line);
    display: flex; gap: 10px; background: var(--panel);
  }
  .modal-foot .btn { flex: 1; }

  .field { display: grid; gap: 6px; }
  .field label {
    font-size: 12px; font-weight: 500; color: var(--ink-2);
    letter-spacing: 0.02em;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .field .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); font-weight: 400;
  }
  .input-wrap {
    display: flex; align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .input-wrap:hover { border-color: var(--line-2); }
  .input-wrap:focus-within { border-color: var(--accent); box-shadow: var(--ring); background: #fff; }
  .input-wrap input, .input-wrap select {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: 0;
    padding: 12px 14px;
    font: inherit; font-size: 14px; color: var(--ink);
    letter-spacing: -0.005em;
  }
  .input-wrap select { appearance: none; -webkit-appearance: none; padding-right: 36px; cursor: pointer; }
  .input-wrap.has-select { position: relative; }
  .input-wrap.has-select::after {
    content: "";
    position: absolute; right: 14px; top: 50%;
    transform: translateY(-30%) rotate(45deg);
    width: 7px; height: 7px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    pointer-events: none;
  }
  .input-wrap .prefix, .input-wrap .suffix {
    padding: 0 14px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .input-wrap .suffix { border-left: 1px solid var(--line); align-self: stretch; display: grid; place-items: center; }

  /* charger-type picker (pretty dropdown alt) */
  .type-picker { display: grid; gap: 8px; }
  .type-opt {
    appearance: none; font: inherit;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; text-align: left;
    transition: all .15s var(--ease);
  }
  .type-opt:hover { border-color: var(--line-2); }
  .type-opt.on { border-color: var(--accent); background: rgba(182,228,195,0.18); box-shadow: var(--ring); }
  .type-opt .t-ico {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; flex: none;
    background: var(--field); color: var(--ink-2); border: 1px solid var(--line);
  }
  .type-opt.ac .t-ico { background: rgba(197,138,46,0.1); color: var(--warning); border-color: rgba(197,138,46,0.28); }
  .type-opt.dc .t-ico { background: rgba(30,127,71,0.08); color: var(--accent); border-color: rgba(30,127,71,0.22); }
  .type-opt .t-txt { display: grid; gap: 2px; flex: 1; min-width: 0; }
  .type-opt .t-t1 { font-size: 13.5px; font-weight: 500; letter-spacing: -0.005em; }
  .type-opt .t-t2 {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--muted); letter-spacing: 0.12em;
  }
  .type-opt .tick {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid var(--line-2);
    display: grid; place-items: center; flex: none;
    color: #fff;
    transition: all .15s var(--ease);
  }
  .type-opt.on .tick { background: var(--accent); border-color: var(--accent); }
  .type-opt .tick svg { opacity: 0; transition: opacity .15s var(--ease); }
  .type-opt.on .tick svg { opacity: 1; }

  /* Delete modal warning */
  .warn-box {
    display: flex; gap: 12px; align-items: flex-start;
    background: rgba(197,138,46,0.08);
    border: 1px solid rgba(197,138,46,0.28);
    border-radius: var(--radius);
    padding: 12px 14px;
  }
  .warn-box .w-ico {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--warning); color: #fff;
    display: grid; place-items: center; flex: none;
  }
  .warn-box p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
  .warn-box p strong { color: var(--ink); font-weight: 500; }

  .delete-head-ico {
    width: 56px; height: 56px; border-radius: 16px;
    background: rgba(180,68,42,0.08);
    color: var(--danger);
    border: 1px solid rgba(180,68,42,0.22);
    display: grid; place-items: center; margin-bottom: 4px;
  }

  /* toast */
  .toast-wrap {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 60;
    width: min(calc(100vw - 32px), 400px);
  }
  .toast {
    background: var(--dark-bg); color: var(--dark-ink);
    border: 1px solid rgba(182,228,195,0.18);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex; gap: 10px; align-items: center;
    box-shadow: 0 20px 50px -20px rgba(14,26,18,0.55);
    animation: toastIn .3s var(--ease);
    font-size: 13.5px;
  }
  @keyframes toastIn { from { opacity:0; transform: translateY(-12px); } to { opacity:1; transform: translateY(0); } }
  .toast .tico {
    width: 28px; height: 28px; border-radius: 8px;
    background: rgba(182,228,195,0.18); color: var(--accent-3);
    display: grid; place-items: center; flex: none;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ============ Mock Data ============ */

const STATION = {

// TODO: GET /api/manager/stations/:id/chargers
const INITIAL_CHARGERS = [
  {

/* ============ Icons ============ */
const Ico = {

  Pencil:  (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M4 20h4l10-10-4-4L4 16v4z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><path d="M14 6l4 4" stroke="currentColor" strokeWidth="1.6"/></svg>,
  Trash:   (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  Pin:     (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.5 7-13a7 7 0 10-14 0c0 5.5 7 13 7 13z" stroke="currentColor" strokeWidth="1.8"/><circle cx="12" cy="9" r="2.5" stroke="currentColor" strokeWidth="1.8"/></svg>,
  Plug:    (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M9 3v4M15 3v4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/><path d="M6 7h12v5a6 6 0 11-12 0V7z" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round"/><path d="M12 18v3" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,
  Check:   (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>,

  Alert:   (p)=><svg {...p} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="1.8"/><path d="M12 7v6M12 16v.5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>,
};

/* ============ Rate cell (inline-edit) ============ */
function RateCell({ value, onChange, chargerId }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(String(value));
  const inputRef = useRef(null);

  useEffect(() => { if (editing && inputRef.current) { inputRef.current.focus(); inputRef.current.select(); } }, [editing]);

  function commit() {
    const n = parseFloat(draft);
    if (!isNaN(n) && n > 0 && n !== value) onChange(n);
    setEditing(false);
    setDraft(String(!isNaN(n) && n > 0 ? n : value));
  }
  function cancel() { setEditing(false); setDraft(String(value)); }

  if (editing) {
    return (
      <div className="rate-cell editing" data-charger-id={chargerId}>
        <span className="unit">฿</span>
        <input
          ref={inputRef}
          inputMode="decimal"
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onBlur={commit}
          onKeyDown={(e) => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') cancel(); }}
          aria-label={`Rate per kWh for ${chargerId}`}
        />
        <span className="suffix">/kWh</span>
      </div>
    );
  }
  return (
    <button
      type="button"
      className="rate-cell"
      data-action="edit-rate"
      data-charger-id={chargerId}
      onClick={() => setEditing(true)}
      aria-label={`Edit rate for ${chargerId}, currently ${value} THB per kWh`}
    >
      <span className="unit">฿</span>
      <span className="val">{value.toFixed(value % 1 === 0 ? 0 : 1)}</span>
      <span className="suffix">/kWh</span>
      <Ico.Pencil className="pencil" width="12" height="12"/>
    </button>
  );
}

/* ============ Add Charger Modal ============ */
function AddModal({ onClose, onAdd }) {
  const [leaving, setLeaving] = useState(false);
  const [typeKey, setTypeKey] = useState('type2_ac');
  const [rate, setRate] = useState('7.5');

  function close() { setLeaving(true); setTimeout(onClose, 180); }
  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') close(); }
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, []);

  const type = CHARGER_TYPES.find(t => t.key === typeKey);
  const rateNum = parseFloat(rate);
  const valid = !isNaN(rateNum) && rateNum > 0;

  function submit() {
    if (!valid) return;
    onAdd({ typeKey, ratePerKWh: rateNum });
  }

  return (
    <div
      className={`modal-backdrop ${leaving ? 'leaving' : ''}`}
      role="dialog" aria-modal="true" aria-labelledby="add-title" id="add-charger-modal"
      onClick={(e) => { if (e.target.classList.contains('modal-backdrop')) close(); }}
    >
      <div className="modal">
        <header className="modal-head">
          <div>
            <div className="mh-eyebrow">New charger · {STATION.id}</div>
            <h2 id="add-title">Add a <em>charger.</em></h2>
          </div>
          <button className="modal-close" aria-label="Close" onClick={close}><Ico.Close width="16" height="16"/></button>
        </header>

        <div className="modal-body">
          <div className="field">
            <label>Charger type</label>
            <div className="type-picker" role="radiogroup" aria-label="Charger type">
              {CHARGER_TYPES.map(t => (
                <button
                  key={t.key}
                  type="button"
                  role="radio"
                  aria-checked={typeKey === t.key}
                  className={`type-opt ${t.connector.toLowerCase()} ${typeKey === t.key ? 'on' : ''}`}
                  data-type={t.key}
                  onClick={() => setTypeKey(t.key)}
                >
                  <span className="t-ico" aria-hidden="true"><Ico.Plug width="16" height="16"/></span>
                  <span className="t-txt">
                    <span className="t-t1">{t.name} <span className={`badge ${t.connector.toLowerCase()}`} style={{marginLeft: 6}}>{t.connector}</span></span>
                    <span className="t-t2">{t.desc}</span>
                  </span>
                  <span className="tick" aria-hidden="true"><Ico.Check width="12" height="12"/></span>
                </button>
              ))}
            </div>
          </div>

          <div className="field">
            <label htmlFor="rate">Rate per kWh <span className="hint">THB</span></label>
            <div className="input-wrap">
              <span className="prefix">฿</span>
              <input
                id="rate"
                inputMode="decimal"
                placeholder="7.50"
                value={rate}
                onChange={(e) => setRate(e.target.value)}
              />
              <span className="suffix">/kWh</span>
            </div>
          </div>
        </div>

        <footer className="modal-foot">
          <button className="btn btn-secondary btn-lg" onClick={close}>Cancel</button>
          <button
            className="btn btn-primary btn-lg"
            data-action="submit-add-charger"
            disabled={!valid}
            onClick={submit}
          >
            Add charger
          </button>
        </footer>
      </div>
    </div>
  );
}

/* ============ Delete Confirmation ============ */
function DeleteModal({ charger, onClose, onConfirm }) {
  const [leaving, setLeaving] = useState(false);
  function close() { setLeaving(true); setTimeout(onClose, 180); }
  useEffect(() => {
    function onKey(e) { if (e.key === 'Escape') close(); }
    window.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, []);

  return (
    <div
      className={`modal-backdrop ${leaving ? 'leaving' : ''}`}
      role="dialog" aria-modal="true" aria-labelledby="del-title" id="delete-charger-modal"
      onClick={(e) => { if (e.target.classList.contains('modal-backdrop')) close(); }}
    >
      <div className="modal sm">
        <div className="modal-body" style={{paddingTop: 28}}>
          <div className="delete-head-ico" aria-hidden="true"><Ico.Trash width="24" height="24"/></div>
          <div>
            <div className="mh-eyebrow">{charger.id} · {charger.typeName}</div>
            <h2 id="del-title" style={{
              fontFamily: "'Instrument Serif', serif", fontWeight: 400,
              fontSize: 28, lineHeight: 1.08, letterSpacing: '-0.02em', margin: '4px 0 0'
            }}>
              Delete this <em className="danger" style={{color: 'var(--danger)', fontStyle: 'italic'}}>charger?</em>
            </h2>
          </div>
          <div className="warn-box">
            <span className="w-ico" aria-hidden="true"><Ico.Warn width="16" height="16"/></span>
            <p>
              <strong>{charger.id}</strong> has <strong>{charger.activeBookings} active booking{charger.activeBookings === 1 ? '' : 's'}</strong>. If this charger has existing bookings, consider marking as <strong>Out of Service</strong> instead — deletion is permanent.
            </p>
          </div>
        </div>
        <footer className="modal-foot">
          <button className="btn btn-secondary btn-lg" onClick={close}>Cancel</button>
          <button
            className="btn btn-danger btn-lg"
            data-action="confirm-delete"
            data-charger-id={charger.id}
            onClick={() => onConfirm(charger.id)}
          >
            <Ico.Trash width="14" height="14"/>
            Delete
          </button>
        </footer>
      </div>
    </div>
  );
}

/* ============ Charger Row ============ */
function ChargerRow({ c, onToggle, onRateChange, onDelete }) {
  const disabled = false;
  const statusLabel =
    c.status === 'available' ? 'Available' :
    c.status === 'in-use' ? 'In use' :
    'Out of service';
  const statusClass =
    c.status === 'available' ? 'on' :
    c.status === 'in-use' ? 'in-use' : 'off';

  return (
    <tr data-charger-id={c.id} data-status={c.status} id={`charger-${c.id}`}>
      <td><span className="ch-id">{c.id}</span></td>
      <td>
        <div className="ch-type-cell">
          <span className={`ch-type-ico ${c.connector.toLowerCase()}`} aria-hidden="true"><Ico.Plug width="16" height="16"/></span>
          <div>
            <div className="ch-type-name">{c.typeName} <span className={`badge ${c.connector.toLowerCase()}`} style={{marginLeft: 6, verticalAlign: 'middle'}}>{c.connector}</span></div>
            <div className="ch-type-connector">{c.typeKey.toUpperCase().replace('_','-')}</div>
          </div>
        </div>
      </td>
      <td><span className="power"><em>{c.maxKW}</em> kW</span></td>
      <td><RateCell value={c.ratePerKWh} onChange={(v) => onRateChange(c.id, v)} chargerId={c.id}/></td>
      <td>
        <div className="status-cell">
          <button
            className={`toggle ${c.status !== 'out-of-service' ? 'on' : ''}`}
            data-action="toggle-status"
            data-charger-id={c.id}
            aria-pressed={c.status !== 'out-of-service'}
            aria-label={`Toggle status for ${c.id}`}
            disabled={c.status === 'in-use'}
            title={c.status === 'in-use' ? 'Cannot change while in use' : ''}
            onClick={() => onToggle(c.id)}
          />
          <span className={`status-pill ${statusClass}`}>{statusLabel}</span>
        </div>
      </td>
      <td>
        <div className="row-actions">
          <button
            className="icon-action"
            data-action="edit-charger"
            data-charger-id={c.id}
            aria-label={`Edit ${c.id}`}
            title="Edit"
          ><Ico.Edit width="15" height="15"/></button>
          <button
            className="icon-action danger"
            data-action="delete-charger"
            data-charger-id={c.id}
            aria-label={`Delete ${c.id}`}
            title="Delete"
            onClick={() => onDelete(c)}
          ><Ico.Trash width="15" height="15"/></button>
        </div>
      </td>
    </tr>
  );
}

/* ============ Charger Mobile Card ============ */
function ChargerCard({ c, onToggle, onRateChange, onDelete }) {
  const statusLabel =
    c.status === 'available' ? 'Available' :
    c.status === 'in-use' ? 'In use' :
    'Out of service';
  const statusClass =
    c.status === 'available' ? 'on' :
    c.status === 'in-use' ? 'in-use' : 'off';

  return (
    <div className="cg-card" data-charger-id={c.id} id={`charger-card-${c.id}`}>
      <div className="cg-top">
        <div className="ch-type-cell">
          <span className={`ch-type-ico ${c.connector.toLowerCase()}`} aria-hidden="true"><Ico.Plug width="16" height="16"/></span>
          <div>
            <div className="ch-id" style={{fontSize: 11}}>{c.id}</div>
            <div className="ch-type-name" style={{fontSize: 15}}>{c.typeName}<span className={`badge ${c.connector.toLowerCase()}`} style={{marginLeft: 6}}>{c.connector}</span></div>
          </div>
        </div>
        <span className={`status-pill ${statusClass}`}>{statusLabel}</span>
      </div>
      <div className="cg-kv">
        <div className="cell">
          <span className="lbl">Max power</span>
          <span className="power"><em>{c.maxKW}</em> kW</span>
        </div>
        <div className="cell">
          <span className="lbl">Rate</span>
          <RateCell value={c.ratePerKWh} onChange={(v) => onRateChange(c.id, v)} chargerId={c.id}/>
        </div>
      </div>
      <div className="cg-foot">
        <div className="status-cell">
          <button
            className={`toggle ${c.status !== 'out-of-service' ? 'on' : ''}`}
            data-action="toggle-status"
            data-charger-id={c.id}
            aria-pressed={c.status !== 'out-of-service'}
            disabled={c.status === 'in-use'}
            onClick={() => onToggle(c.id)}
          />
          <span style={{fontSize: 11.5, color: 'var(--muted)'}}>{c.status === 'in-use' ? 'Locked · in use' : 'Toggle service'}</span>
        </div>
        <div className="row-actions">
          <button className="icon-action" data-action="edit-charger" data-charger-id={c.id} aria-label="Edit"><Ico.Edit width="15" height="15"/></button>
          <button className="icon-action danger" data-action="delete-charger" data-charger-id={c.id} aria-label="Delete" onClick={() => onDelete(c)}><Ico.Trash width="15" height="15"/></button>
        </div>
      </div>
    </div>
  );
}

/* ============ App ============ */
function App() {
  const [chargers, setChargers] = useState(INITIAL_CHARGERS);
  const [filter, setFilter] = useState('all');
  const [showAdd, setShowAdd] = useState(false);
  const [toDelete, setToDelete] = useState(null);
  const [toast, setToast] = useState(null);

  function flash(msg) { setToast(msg); setTimeout(() => setToast(null), 2600); }

  const counts = useMemo(() => ({
    all: chargers.length,
    available: chargers.filter(c => c.status === 'available').length,
    'in-use': chargers.filter(c => c.status === 'in-use').length,
    'out-of-service': chargers.filter(c => c.status === 'out-of-service').length,
  }), [chargers]);

  const filtered = useMemo(() => {
    if (filter === 'all') return chargers;
    return chargers.filter(c => c.status === filter);
  }, [chargers, filter]);

  const totals = useMemo(() => ({
    count: chargers.length,
    totalKW: chargers.reduce((a, c) => a + c.maxKW, 0),
    avgRate: chargers.length ? (chargers.reduce((a,c) => a + c.ratePerKWh, 0) / chargers.length) : 0,
  }), [chargers]);

  function toggleStatus(id) {
    setChargers(list => list.map(c => {
      if (c.id !== id) return c;
      if (c.status === 'in-use') return c;
      return { ...c, status: c.status === 'available' ? 'out-of-service' : 'available' };
    }));
  }
  function rateChange(id, newRate) {
    setChargers(list => list.map(c => c.id === id ? { ...c, ratePerKWh: newRate } : c));
    flash(`Rate updated · ฿${newRate.toFixed(2)}/kWh`);
  }
  function addCharger({ typeKey, ratePerKWh }) {
    const type = CHARGER_TYPES.find(t => t.key === typeKey);
    const idx = chargers.length + 1;
    const id = 'CH-' + String.fromCharCode(65 + Math.min(idx-1, 25)) + String(idx).padStart(2, '0');
    const newCh = {
      id, typeKey, typeName: type.name, connector: type.connector, maxKW: type.maxKW,
      ratePerKWh, status: 'available', activeBookings: 0,
    };
    setChargers(list => [...list, newCh]);
    setShowAdd(false);
    flash(`Added · ${id} · ${type.name}`);
  }
  function doDelete(id) {
    setChargers(list => list.filter(c => c.id !== id));
    setToDelete(null);
    flash(`Deleted · ${id}`);
  }

  return (
    <>
      <header className="topbar">
        <div className="brand-row">
          <a className="brand" href="#"><span className="brand-mark" aria-hidden="true">
            <svg width="14" height="16" viewBox="0 0 14 16" fill="none"><path d="M8 1L1 9h4l-1 6 7-8H7l1-6z" fill="#fff"/></svg>
          </span><span className="brand-name">EV Charger</span></a>
          <span className="brand-tag">Manager</span>
        </div>
        <div className="top-actions">
          <button className="icon-btn" aria-label="Notifications" title="Notifications"><Ico.Bell width="18" height="18"/></button>
          <div className="user-chip">
            <div className="user-avatar">AJ</div>
            <div className="user-info"><span className="user-name">Ajarn Jack</span><span className="user-role">Network Manager</span></div>
          </div>
        </div>
      </header>

      <div className="page">

        <nav className="crumbs" aria-label="Breadcrumb">
          <a href="#" data-route="dashboard">Dashboard</a>
          <span className="sep">/</span>
          <a href="#" data-route={`station-${STATION.id}`}>{STATION.name}</a>
          <span className="sep">/</span>
          <span className="here">Chargers</span>
        </nav>

        <section className="station-head" aria-labelledby="st-name" data-station-id={STATION.id}>
          <div className="sh-left">
            <span className="sh-eyebrow">Station · {STATION.id}</span>
            <h1 className="sh-name" id="st-name">{STATION.name.split(' ').slice(0,-1).join(' ')} <em>{STATION.name.split(' ').slice(-1)}.</em></h1>
            <div className="sh-addr"><Ico.Pin width="14" height="14"/><span>{STATION.address}</span></div>
          </div>
          <div className="sh-meta">
            <div className="cell"><span className="lbl">Chargers</span><span className="val">{totals.count}</span></div>
            <div className="cell"><span className="lbl">Total capacity</span><span className="val"><em>{totals.totalKW}</em> <span style={{fontSize: 13, color: 'var(--muted)', fontFamily: "'JetBrains Mono', monospace", letterSpacing: '0.14em', textTransform: 'uppercase', fontStyle: 'normal'}}>kW</span></span></div>
            <div className="cell"><span className="lbl">Avg. rate</span><span className="val"><em>฿{totals.avgRate.toFixed(2)}</em> <span style={{fontSize: 13, color: 'var(--muted)', fontFamily: "'JetBrains Mono', monospace", letterSpacing: '0.14em', textTransform: 'uppercase', fontStyle: 'normal'}}>/kWh</span></span></div>
          </div>
        </section>

        <div className="sec-head">
          <div>
            <div className="sec-num">01 — Chargers</div>
            <h2>Ports &amp; <em>rates.</em></h2>
          </div>
          <button
            className="btn btn-primary btn-lg"
            data-action="open-add-charger"
            id="add-charger-btn"
            onClick={() => setShowAdd(true)}
          >
            <Ico.Plus width="16" height="16"/>
            Add New Charger
          </button>
        </div>

        <div className="filter-row" role="tablist" aria-label="Filter chargers">
          {[
            ['all', 'All'],
            ['available', 'Available'],
            ['in-use', 'In use'],
            ['out-of-service', 'Out of service'],
          ].map(([k, l]) => (
            <button
              key={k}
              className={`filter-chip ${filter === k ? 'on' : ''}`}
              data-filter={k}
              role="tab"
              aria-selected={filter === k}
              onClick={() => setFilter(k)}
            >
              {l}
              <span className="cnt">{counts[k]}</span>
            </button>
          ))}
        </div>

        {/* Desktop table */}
        <div className="table-wrap">
          <table className="table" aria-label="Chargers">
            <thead>
              <tr>
                <th style={{width: '110px'}}>Charger ID</th>
                <th>Type</th>
                <th style={{width: '110px'}}>Max power</th>
                <th style={{width: '170px'}}>Rate per kWh</th>
                <th style={{width: '200px'}}>Status</th>
                <th style={{width: '100px', textAlign: 'right'}}>Actions</th>
              </tr>
            </thead>
            <tbody id="chargers-tbody">
              {filtered.map(c => (
                <ChargerRow
                  key={c.id} c={c}
                  onToggle={toggleStatus}
                  onRateChange={rateChange}
                  onDelete={setToDelete}
                />
              ))}
              {filtered.length === 0 && (
                <tr><td colSpan={6} style={{textAlign:'center', padding: '40px 20px', color: 'var(--muted)'}}>
                  No chargers match this filter.
                </td></tr>
              )}
            </tbody>
          </table>
        </div>

        {/* Mobile cards */}
        <div className="card-list">
          {filtered.map(c => (
            <ChargerCard key={c.id} c={c} onToggle={toggleStatus} onRateChange={rateChange} onDelete={setToDelete}/>
          ))}
        </div>

        <button className="add-card" data-action="open-add-charger" onClick={() => setShowAdd(true)}>
          <span className="add-ico" aria-hidden="true"><Ico.Plus width="20" height="20"/></span>
          <div>
            <div className="t1">Add a <em>new charger.</em></div>
            <div className="t2">Install a new port on this station — Type 2 AC, CCS DC, or CHAdeMO.</div>
          </div>
        </button>

      </div>

      {showAdd && <AddModal onClose={() => setShowAdd(false)} onAdd={addCharger}/>}
      {toDelete && <DeleteModal charger={toDelete} onClose={() => setToDelete(null)} onConfirm={doDelete}/>}

      {toast && (
        <div className="toast-wrap" role="status" aria-live="polite">
          <div className="toast">
            <span className="tico" aria-hidden="true"><Ico.Check width="16" height="16"/></span>
            <span>{toast}</span>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
